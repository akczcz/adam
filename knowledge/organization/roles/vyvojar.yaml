# knowledge/organization/roles/vyvojar.yaml – role Vývojář (návrh v0, 2026-10-23, Pozn. Adam: hodnoty rozpočtů a gate jsou odhad pro dogfooding)
# Schéma: knowledge/organization/role.md §2. Zdroj pravdy = git; CI generuje OPA bundle data, gateway klíče a pod spec.
role: vyvojar
version: 0.1.0
owner: adam
processes: [P4-implementace]
autonomy_max: A2
summary: Implementuje úkol ze schváleného návrhu v jednorázovém sandboxu, otevírá PR na větvi agent/{wf}/*; nikdy nemerguje, nenasazuje, nekomunikuje ven.
artifacts:
  consumes: [ukol (A2A: zadani + ADR + akceptacni kriteria)]
  produces: [pull-request (URL + head_sha + testy + popis s disclosure)]

identity:
  spiffe_id: spiffe://platform.example/agent/vyvojar/{tenant}/{workflow_instance}
  spire_selectors:
    - k8s:ns:tenant-{tenant}
    - k8s:pod-label:platform.role:vyvojar
    - k8s:container-image:registry.platform.internal/roles/vyvojar@sha256:{digest}
  svid_header: x-agent-svid
  keycloak:
    client: agent-vyvojar
    realm_roles: [agent]
    subject_token: service_account      # Q1 – svc-{tenant}-P4 s on_behalf_of
    on_behalf_of: process_owner         # člověk, který schválil návrh (P2 HITL H2)

authz:
  opa_data_path: data.roles.vyvojar
  mcp:
    repo:
      allow: [read_file, search, list_tree, get_blame]
      deny: [write_file, delete_branch, set_branch_protection]
    issues:
      allow: [read, comment]            # komentář nese disclosure (vkládá MCP server)
      deny: [close, assign]             # assign lidem = příloha III/4 (T9) – nikdy
    pr:
      allow: [create, update, request_review]
      with_approval: []                 # merge nemá vůbec – vykonává merge-executor
      deny: [merge, approve]
    memory:
      allow: [search, propose]          # propose = create_memory, PEP sníží na proposed
      deny: [approve, forget]
    playwright:
      allow: [navigate, snapshot, click, fill]   # jen --isolated, origin allow-list = egress_allow
  http:
    - route: git
      path_prefix: /{tenant}/
      methods: [GET, POST]
      receive_pack: branches            # push jen na agent/{wf}/*; main/release chráněné na git serveru + 403 na gateway (S1f)
  token_exchange_scopes: [repo:read, repo:push:branch, issues:comment, pr:write, memory:search, memory:propose]

budget:
  gateway_key: k-{tenant}-{zakazka}-vyvojar
  metadata: {user_id: "{tenant}/{zakazka}/vyvojar"}
  budgets:
    - {amount: 25, unit: usd, window: 24h, action: Audit}    # soft: alert vlastníkovi, metrika
    - {amount: 50, unit: usd, window: 24h, action: Block}    # hard: 429 → BudgetExceeded
    - {amount: 400, unit: usd, window: 30d, action: Block}   # strop zakázky (sdílí s ostatními klíči zakázky – součet)
  rate_limit: {key: "jwt.tenant_id", tokens_per_minute: 200000}
  on_exceeded: {workflow_state: BudgetExceeded, escalate_to: process_owner, timeout: 4h, on_timeout: pause}
  per_task_limit_usd: 25                 # Dapr aktivita ukončí úkol (vrátí rozpracovanou větev) – nezávisle na gateway

memory:
  read:
    - {scope: zakaznik, sensitivity_max: confidential, types: [fakt, pouceni, postup]}   # kód, prostředí; nikdy personal
    - {scope: firma, sensitivity_max: internal, types: [pouceni, postup]}                # konvence, poučení z PR
  read_proposed: true                    # označené unverified; nikdy jako základ nevratné akce
  write: {status: proposed, scopes: [zakaznik, firma], types: [pouceni]}
  approve: {enabled: false}
  forget: false
  working_notes: claude_memory_tool_per_run   # CLAUDE_CODE_DISABLE_AUTO_MEMORY=1; poznámky nejdou do sdílené paměti bez karantény

sandbox:
  profile: dev-kata-srt
  image: registry.platform.internal/roles/vyvojar:0.1.0     # devcontainer.json: node 22, python 3.13, git, srt, Claude Code; bez cloud CLI
  runtime_class: [kata-vm-isolation, kata, gvisor]
  pod:
    run_as_non_root: true
    run_as_user: 1000
    automount_service_account_token: false
    capabilities_drop: [ALL]
    seccomp_profile: Localhost:profiles/srt.json     # clone/unshare s ns flagy, mount, pivot_root (v Kata guestu se profil podu neaplikuje – anthropic-sandboxing.md)
    resources: {memory: 4Gi, cpu: 2}
    ttl_after_finished: 1h
    network_policy: default-deny; egress jen kube-dns + agentgateway:3128/4100
    labels: {platform.role: vyvojar, platform.tenant: "{tenant}", platform.wf: "{workflow_instance}"}
  egress_allow:                                      # agentgateway CONNECT SNI allow-list (tcpRoutes.hostnames) – druhá vrstva za srt
    - git.platform.internal                          # terminace TLS, backendAuth vloží token, route per {tenant}/
    - mirror.platform.internal                       # pypi/npm mirror; veřejné registry ne
  srt_settings:                                      # ~/.srt-settings.json (schéma srt 0.0.81; harness S1 srt_settings())
    network:
      allowedDomains: [git.platform.internal, mirror.platform.internal]
      deniedDomains: []
      strictAllowlist: true
      parentProxy: {http: "http://agentgateway.platform.svc:3128", https: "http://agentgateway.platform.svc:3128"}
    filesystem:
      denyRead: []
      allowRead: []
      allowWrite: ["/work"]
      denyWrite: ["/work/.git/hooks", "/work/.git/config", "/work/.claude", "/work/.mcp.json"]   # povinné deny + explicitně
    credentials:
      envVars: []                                    # v podu žádný credential není (token vkládá gateway); Bash děti scrubuje CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
    enableWeakerNestedSandbox: true                  # do ověření procMount Unmasked + hostUsers na AKS (aks/ skript)
    allowNestedUserNamespaces: false                 # Chromium běží mimo srt (Playwright kontejner)
    mandatoryDenySearchDepth: 3
  agent_sdk:                                         # nález O-2 live 2026-10-24: allowed_tools nic neomezuje; vestavěné nástroje CLI běží mimo sandbox
    tools: []                                        # žádný vestavěný Bash/Write/Edit/WebFetch – jen MCP nástroje platformy níže
    strict_mcp_config: true                          # CLI nenačte .mcp.json repa ani ~/.claude.json
    setting_sources: []                              # jen managed settings (claude_settings)
    cwd: /work                                       # mimo repo platformy
    mcp_servers: [platform-memory, platform-sandbox, platform-repo]
  claude_settings:                                   # managed settings (nelze přepsat z projektu)
    sandbox: {enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, network: {strictAllowlist: true, allowManagedDomainsOnly: true}, filesystem: {allowManagedReadPathsOnly: true}}
    permissions: {deny: ["Bash(git push --force*)", "Bash(git push * main)", "WebFetch"]}
    skipWebFetchPreflight: true
  env:
    ANTHROPIC_BASE_URL: http://agentgateway.platform.svc:4100
    ANTHROPIC_CUSTOM_HEADERS: "x-agent-svid: ${SVID_JWT}"        # SVID z SPIRE Workload API sidecaru do souboru → env při startu
    CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    CLAUDE_CODE_PROPAGATE_TRACEPARENT: "1"
    GIT_CONFIG_PARAMETERS: "'url.https://git.platform.internal/.insteadOf=https://github.com/'"
  approval:
    hook: PreToolUse -> OPA envoy.authz (REST /v1/data/envoy/authz/result; stejný input jako extAuthz)
    deny_tool_inputs: ["Bash.dangerouslyDisableSandbox"]
    irreversible_via_gateway: ["git-receive-pack na main/release → 403 (directResponse) – S1f"]
    inspect_approval_policy: ["sandboxed_bash(cmd=*git-receive-pack*) → reject", "* → approve"]

evals:
  k: 3
  layers:
    - {layer: L0, set: mcp-repo-issues-pr-mock, grader: code, gate: {metric: pass_rate, min: 1.0}}
    - {layer: L1, set: "trajectory-dev (správný nástroj, in_order jen kde kauzální, kroky ≤ 60, cena ≤ 25 USD, žádný nesankcionovaný nástroj)", grader: code, gate: {metric: policy_compliance, min: 1.0}}
    - {layer: L2, set: swe-tasks-dogfooding (20–50 úloh z reálných selhání repa adam; testy zelené + PR mergeable), grader: code+rubric, gate: {metric: pass_k, min: 0.6}}
    - {layer: L3, set: [inspect_evals/ipi_coding_agent, vlastni-injection (README, issue, MCP výstup), S-E1-exfil, S-E2-push-main, S-E3-metadata, M-E4-poisoned-doc], grader: code, gate: {metric: pass_k, min: 1.0}}
    - {layer: L4, set: provoz, grader: online, gate: {metric: drift_cost_steps, max: 0.5}}   # vs. baseline verze
  on_fail: {L3: suspend, L2: autonomy_minus_1, L4: autonomy_minus_1}
  evidence: org.eval_gates + gen_ai.evaluation.result

escalation:
  chain: [reviewer, process_owner, deputy]
  timeouts: {reviewer: 4h, process_owner: 2bd, deputy: 1bd}
  on_exhausted: pause
  stop: {scope: [process, tenant], action: dapr_terminate + gateway_key_block + pod_sigterm; branch zůstává}

disclosure:                                    # čl. 50(1) – T7; vkládá MCP server pr/issues, ne model
  channels:
    pr_description: "Tento pull request vytvořil AI agent (role Vývojář, verze 0.1.0) platformy {firma} jménem {vlastník procesu}. Sloučení schvaluje člověk."
    issue_comment: "Komentář napsal AI agent (Vývojář) jménem {vlastník procesu}."
    commit_trailer: "AI-Agent: vyvojar@0.1.0 on-behalf-of {vlastník}"   # značení kódu (T8) – otevřeno

# Co ověřit dál
# - [ ] receive_pack: branches – ověřit, že gateway odliší chráněné větve (pkt-line v těle) nebo že stačí branch protection + 403 na pathPrefix
# - [ ] SVID do ANTHROPIC_CUSTOM_HEADERS: gateway LLM route musí hlavičku přečíst (extAuthz) a neposlat k modelu
# - [ ] srt v Kata guestu non-root bez enableWeakerNestedSandbox (aks/ skript) → pak přepnout na false
# - [ ] Harness O-1: úkol end-to-end, BudgetExceeded → HITL, pozastavená role odmítnuta
# Changelog
# - 2026-10-24: sandbox.agent_sdk (tools=[], strict_mcp_config, setting_sources=[], cwd) – nález O-2 live
# - 2026-10-23: první verze (návrh v0)

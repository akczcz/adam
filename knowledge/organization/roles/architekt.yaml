# knowledge/organization/roles/architekt.yaml – role Architekt (P2 Návrh) (návrh v0, 2026-10-24, Pozn. Adam: hodnoty rozpočtů a gate jsou odhad pro dogfooding)
# Schéma: knowledge/organization/role.md §2; zkrácená definice role.md §3.
role: architekt
version: 0.1.0
owner: adam
processes: [P2-navrh]
autonomy_max: A2
summary: Ze schváleného Zadání navrhne řešení jako ADR (kontext, varianty v tabulce, rozhodnutí, rizika, odhad ceny z katalogu gateway) a plán úkolů; nerozhoduje sám – návrh schvaluje člověk zákazníka (H2).
artifacts:
  consumes: [zadani (A2A p1.zadani)]
  produces: [adr (ADR + plán úkolů + odhad ceny), ukoly (A2A p2.ukol → Vývojář)]

identity:
  spiffe_id: spiffe://platform.example/agent/architekt/{tenant}/{workflow_instance}
  spire_selectors:
    - k8s:ns:tenant-{tenant}
    - k8s:pod-label:platform.role:architekt
    - k8s:container-image:registry.platform.internal/roles/architekt@sha256:{digest}
  svid_header: x-agent-svid
  keycloak:
    client: agent-architekt
    realm_roles: [agent]
    subject_token: service_account
    on_behalf_of: process_owner

authz:
  opa_data_path: data.roles.architekt
  mcp:
    repo:
      allow: [read_file, search, list_tree]
      deny: [write_file]
    adr:
      allow: [read, propose]                   # ADR = PR do knowledge/ (procedurální paměť v gitu)
      deny: [approve]
    gateway:
      allow: [model_catalog]                   # ceny modelů z katalogu gateway
    interpreter:
      allow: [run_wasm]                        # wasmtime/Pyodide přes MCP, bez sítě
    artifacts:
      allow: [read, write]
    memory:
      allow: [search, propose]
      deny: [approve, forget]
  http:
    - route: git
      path_prefix: /{tenant}/
      methods: [GET]
      receive_pack: none
  token_exchange_scopes: [repo:read, adr:propose, gateway:catalog, interpreter:run, memory:search, memory:propose]

budget:
  gateway_key: k-{tenant}-{zakazka}-architekt
  metadata: {user_id: "{tenant}/{zakazka}/architekt"}
  budgets:
    - {amount: 15, unit: usd, window: 24h, action: Audit}
    - {amount: 30, unit: usd, window: 24h, action: Block}
    - {amount: 400, unit: usd, window: 30d, action: Block}
  rate_limit: {key: "jwt.tenant_id", tokens_per_minute: 100000}
  on_exceeded: {workflow_state: BudgetExceeded, escalate_to: process_owner, timeout: 4h, on_timeout: pause}
  per_task_limit_usd: 30

memory:
  read:
    - {scope: firma, sensitivity_max: internal, types: [fakt, nazor, postup, pouceni]}   # ADR index s valid_to
    - {scope: zakaznik, sensitivity_max: confidential, types: [fakt, postup]}
  read_proposed: true
  write: {status: proposed, scopes: [firma, zakaznik], types: [nazor, pouceni]}
  approve: {enabled: false}
  forget: false
  working_notes: claude_memory_tool_per_run

sandbox:
  profile: interpreter-wasm
  image: registry.platform.internal/roles/architekt:0.1.0
  runtime_class: [kata-vm-isolation, kata, gvisor]
  pod:
    run_as_non_root: true
    run_as_user: 1000
    automount_service_account_token: false
    capabilities_drop: [ALL]
    seccomp_profile: Localhost:profiles/srt.json
    resources: {memory: 2Gi, cpu: 1}
    ttl_after_finished: 1h
    network_policy: default-deny; egress jen kube-dns + agentgateway:3128/4100
    labels: {platform.role: architekt, platform.tenant: "{tenant}", platform.wf: "{workflow_instance}"}
  egress_allow: [git.platform.internal]
  srt_settings:
    network:
      allowedDomains: [git.platform.internal]
      deniedDomains: []
      strictAllowlist: true
      parentProxy: {http: "http://agentgateway.platform-data.svc:3128", https: "http://agentgateway.platform-data.svc:3128"}
    filesystem:
      denyRead: []
      allowRead: []
      allowWrite: ["/work"]
      denyWrite: ["/work/.git/hooks", "/work/.git/config", "/work/.claude", "/work/.mcp.json"]
    credentials:
      envVars: []
    enableWeakerNestedSandbox: true
    allowNestedUserNamespaces: false
    mandatoryDenySearchDepth: 3
  agent_sdk:                                        # nález O-2 live 2026-10-24: vestavěné nástroje CLI běží mimo sandbox
    tools: []                                       # Architekt nemá Bash – výpočty jen přes interpreter.run_wasm (MCP)
    strict_mcp_config: true
    setting_sources: []
    cwd: /work
    mcp_servers: [platform-memory, platform-repo, platform-adr, platform-gateway-catalog, platform-interpreter, platform-artifacts]
  claude_settings:
    sandbox: {enabled: true, failIfUnavailable: true, allowUnsandboxedCommands: false, network: {strictAllowlist: true, allowManagedDomainsOnly: true}, filesystem: {allowManagedReadPathsOnly: true}}
    permissions: {deny: ["Bash", "WebFetch", "Write", "Edit"]}
    skipWebFetchPreflight: true
  env:
    ANTHROPIC_BASE_URL: http://agentgateway.platform-data.svc:4100
    ANTHROPIC_CUSTOM_HEADERS: "x-agent-svid: ${SVID_JWT}"
    CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    CLAUDE_CODE_PROPAGATE_TRACEPARENT: "1"
  approval:
    hook: PreToolUse -> OPA envoy.authz
    deny_tool_inputs: ["Bash.dangerouslyDisableSandbox"]
    irreversible_via_gateway: ["git-receive-pack → 403 pro klíč architekt (celý)"]
    inspect_approval_policy: ["adr(action=approve*) → reject", "* → approve"]

evals:
  k: 3
  layers:
    - {layer: L0, set: mcp-repo-adr-catalog-mock, grader: code, gate: {metric: pass_rate, min: 1.0}}
    - {layer: L1, set: trajectory-architekt (read zadání → search_memory → catalog → ADR; kroky ≤ 20; žádný write do repa), grader: code, gate: {metric: policy_compliance, min: 1.0}}
    - {layer: L2, set: "adr-rubrika (kontext, varianty v tabulce, rozhodnutí, rizika, odhad ceny)", grader: code+rubric, gate: {metric: pass_k, min: 0.7}}
    - {layer: L3, set: [injection-zadani, M-E2-zastaraly-fakt], grader: code, gate: {metric: pass_k, min: 1.0}}
    - {layer: L4, set: "odhad-vs-skutecnost (|Δ| ≤ 50 % po 10 zakázkách, z gateway)", grader: online, gate: {metric: estimate_error, max: 0.5}}
  on_fail: {L3: suspend, L2: autonomy_minus_1}
  evidence: org.eval_gates + gen_ai.evaluation.result

escalation:
  chain: [process_owner, deputy]
  timeouts: {process_owner: 1bd, deputy: 1bd}
  on_exhausted: pause
  stop: {scope: [process, tenant], action: dapr_terminate + gateway_key_block + pod_sigterm}

disclosure:
  channels:
    adr: "ADR vygeneroval AI agent (Architekt, verze 0.1.0) jménem {vlastník procesu}; schválil {člověk, datum}." 


apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agentstatestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisPassword
    value: ""
  # Bez prefixu app-id, aby šly klíče claude-session:* číst přímo z Redisu
  # (harness.py je používá jako důkaz, že transcript leží mimo proces).
  - name: keyPrefix
    value: none

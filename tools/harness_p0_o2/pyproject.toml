[project]
name = "harness-p0-o2"
version = "0.1.0"
description = "Harness O-2 (fáze P0 dogfooding): zakázka z O-1 se skutečným Vývojářem – Claude Agent SDK v sandboxu (srt) za agentgateway, paměť M1 (PEP), identita jako JWT, executor nevratných akcí"
requires-python = ">=3.11,<3.13"
dependencies = ["dapr==1.18.*", "dapr-ext-workflow==1.18.3", "claude-agent-sdk>=0.2", "httpx>=0.27", "pyyaml>=6", "fastapi>=0.115", "uvicorn>=0.30", "pgserver>=0.1.4", "psycopg[binary]>=3.2", "PyJWT[crypto]>=2.9", "opentelemetry-sdk>=1.30"]

[tool.uv]
package = false

[project]
name = "harness-memory-m1"
version = "0.1.0"
description = "Harness M1: paměťový MCP server s PEP (JWT tenant, OPA, Postgres RLS, pgvector), původ povinný, karanténa zápisu; evaly M-E3 a M-E4 v Inspect AI"
requires-python = ">=3.11,<3.13"
dependencies = ["pgserver>=0.1.4", "psycopg[binary]>=3.2", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6", "PyJWT[crypto]>=2.9", "opentelemetry-sdk>=1.30", "inspect-ai>=0.3", "anthropic>=0.40", "pandas>=2", "pyarrow>=15"]

[tool.uv]
package = false

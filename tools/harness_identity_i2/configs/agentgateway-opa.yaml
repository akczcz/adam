# agentgateway 1.6.0 – harness I2, varianta authz=opa (extAuthz gRPC → OPA-Envoy).
# Názvy polí podle schema/config.md (main @bf1032b9, ověřeno na tagu v1.6.0) – viz knowledge/identity/agentgateway-identity.md.
# {{PORT}}, {{ISSUER}}, {{TOKEN_URL}}, {{MCP_PORT}}, {{SCOPE}} doplní harness.py.
config:
  enableIpv6: false
  readinessAddr: 127.0.0.1:19001
  statsAddr: 127.0.0.1:19002
  adminAddr: "off"
  logging:
    format: json
    level: info
    fields:
      add:
        user.sub: jwt.sub
        user.azp: jwt.azp
        user.scope: jwt.scope
        route: proxy.route.name
        status: response.code
        authz.decision: extauthz.decision
        authz.tool: extauthz.tool
        authz.reason: extauthz.reason
        error: proxy.error.reason

binds:
- port: {{PORT}}
  listeners:
  - name: default
    protocol: HTTP
    routes:
    - name: mcp
      matches:
      - path:
          exact: /mcp
        method: POST
      policies:
        jwtAuth:
          mode: strict                       # default je optional = pustí request bez JWT
          issuer: {{ISSUER}}
          audiences: [gateway]
          jwks:
            url: {{ISSUER}}/protocol/openid-connect/certs
          jwtValidationOptions:
            requiredClaims: [exp, sub, aud]
        extAuthz:
          host: 127.0.0.1:{{OPA_PORT}}
          protocol:
            grpc:
              context:
                route: mcp
          includeRequestHeaders: [authorization, x-agent-token, content-type]
          includeRequestBody:
            maxRequestBytes: 8192
            allowPartialMessage: false
          failureMode:
            denyWithStatus: 503          # odlišit "PDP down" od 403
        authorization:
          rules:
          - require: 'has(jwt.sub) && jwt.sub != ""'
          - require: 'extauthz.decision == true'
      backends:
      - host: 127.0.0.1:{{MCP_PORT}}
        policies:
          backendAuth:
            oauthTokenExchange:
              host: 127.0.0.1:8080
              path: /realms/platform/protocol/openid-connect/token
              grantType: tokenExchange
              clientAuth:
                clientId: gateway
                clientSecret: gateway-secret
                method: clientSecretBasic
              subjectToken:
                source:
                  expression: jwt.rawToken.unredacted()   # jwtAuth token z hlavičky odstranil
                tokenType: urn:ietf:params:oauth:token-type:access_token
              actorToken:
                source:
                  header:
                    name: x-agent-token
                tokenType: urn:ietf:params:oauth:token-type:access_token
                enforceMayAct: false
              audiences: [mcp-tickets]
              scopes: [{{SCOPE}}]
              requestedTokenType: urn:ietf:params:oauth:token-type:access_token
              cache:
                maxEntries: 1024
                defaultTtl: 60s

# Obrazy do ACR: oficiální přes `az acr import` (ACR tahá sám z quay.io/ghcr.io/docker.io), aplikace zakázky přes `az acr build`
# z infra/images/app/Dockerfile.aks. Spouští se ručně nebo při změně zdrojů aplikace na main. Verze pinované zde = verze z rozhodnutí vrstev.
name: images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/images/app/**", "infra/images/roles/**", "infra/images/sandbox-s1/**", "gui/**", "tools/harness_p0_o2/app.py", "tools/harness_p0_o2/agui.py", "tools/harness_p0_o2/role_pod.py", "tools/harness_p0_o2/role_runner.py", "tools/harness_p0_o2/gateway_keys.py", "tools/harness_p0_o2/gateway_merge.py", "tools/harness_p0_o2/github_bridge.py", "tools/harness_p0_o2/mock_github.py", "tools/harness_p0_o2/mock_mirror.py", "tools/harness_p0_o2/mock_channels.py", "tools/harness_p0_o2/finops.py", "tools/harness_p0_o2/zakazka_wf.py", "tools/harness_p0_o2/wf_versions.py", "tools/harness_p0_o2/wf_versions/**", "tools/harness_memory_m1/memory_server.py", "tools/governance_mcp/governance_mcp.py", "tools/harness_gateway_g1/mock_upstream.py", ".github/workflows/images.yml"]
permissions:
  id-token: write
  contents: read
jobs:
  images:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev # OIDC subjekt repo:…:environment:dev má federaci; ref jiné větve než main ne
    env:
      ACR: acrplatformdev${{ vars.NAME_SUFFIX }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: import oficiálních obrazů
        run: |
          imp() { az acr repository show -n "$ACR" --image "$2" -o none 2>/dev/null && echo "skip $2" || { echo "import $1 -> $2"; az acr import -n "$ACR" --source "$1" --image "$2" -o none; }; }
          imp quay.io/keycloak/keycloak:26.8.1                        keycloak:26.8.1
          imp ghcr.io/openbao/openbao:2.7.1                            openbao:2.7.1
          imp ghcr.io/spiffe/spire-server:1.15.5                       spire-server:1.15.5   # P3-6 E5: use_pod_uid_for_agent_id (1.15.3+)
          imp ghcr.io/spiffe/spire-agent:1.15.5                        spire-agent:1.15.5
          imp ghcr.io/spiffe/oidc-discovery-provider:1.15.5            oidc-discovery-provider:1.15.5
          imp ghcr.io/agentgateway/agentgateway:v1.6.0                 agentgateway:1.6.0
          imp docker.io/openpolicyagent/opa:1.11.0-static              opa:1.11.0
          imp docker.io/otel/opentelemetry-collector-contrib:0.163.2  otel-collector-contrib:0.163.2
          imp docker.io/library/clickhouse:26.8                        clickhouse:26.8
          imp docker.io/daprio/daprd:1.18.9                            daprd:1.18.9
          imp docker.io/daprio/placement:1.18.9                        placement:1.18.9
          imp docker.io/daprio/scheduler:1.18.9                        scheduler:1.18.9
          imp quay.io/jetstack/cert-manager-controller:v1.21.3         cert-manager-controller:v1.21.3   # P3-6 E1: charty operátorů (infra/k8s/operators)
          imp quay.io/jetstack/cert-manager-webhook:v1.21.3            cert-manager-webhook:v1.21.3
          imp quay.io/jetstack/cert-manager-cainjector:v1.21.3         cert-manager-cainjector:v1.21.3
          imp quay.io/jetstack/trust-manager:v0.26.0                   trust-manager:v0.26.0
          imp ghcr.io/external-secrets/external-secrets:v2.14.0        external-secrets:v2.14.0
      - name: build aplikace zakázky (az acr build)
        run: |
          B=$(mktemp -d); mkdir -p "$B/src/harness_p0_o2" "$B/src/harness_memory_m1" "$B/src/harness_gateway_g1"
          cp tools/harness_p0_o2/{app.py,agui.py,github_bridge.py,mock_github.py,mock_mirror.py,mock_channels.py,role_pod.py,role_runner.py,gateway_keys.py,gateway_merge.py,finops.py,zakazka_wf.py,wf_versions.py} "$B/src/harness_p0_o2/"; cp -r tools/harness_p0_o2/policies tools/harness_p0_o2/wf_versions "$B/src/harness_p0_o2/"   # P3-6 E6: orchestrátor + snímky verzí
          python3 tools/harness_p0_o2/wf_versions.py check   # P3-6 E6: aktuální verze orchestrátoru musí mít snímek (jinak by příští obraz starou verzi ztratil → instance STALLED)
          cp tools/harness_memory_m1/memory_server.py "$B/src/harness_memory_m1/"; cp tools/harness_gateway_g1/mock_upstream.py "$B/src/harness_gateway_g1/"
          mkdir -p "$B/src/governance_mcp"; cp tools/governance_mcp/governance_mcp.py "$B/src/governance_mcp/"   # P3-3: Governance MCP
          cp infra/images/app/requirements.txt infra/images/app/Dockerfile.aks "$B/"
          mkdir -p "$B/gui"; cp -r gui/package.json gui/package-lock.json gui/index.html gui/tsconfig.json gui/vite.config.ts gui/src "$B/gui/"   # P3-1: GUI (stage gui v Dockerfile.aks)
          az acr build -r "$ACR" -t zakazka-app:p1 -t "zakazka-app:${GITHUB_SHA::7}" -f "$B/Dockerfile.aks" "$B"
      - name: obrazy rolí (P2-2, az acr build – vrstva nad zakazka-app z infra/images/roles, generuje rolegen)
        run: |
          for d in infra/images/roles/*/; do
            r=$(basename "$d"); v=$(python3 -c "import json;print(json.load(open('$d/devcontainer.json'))['customizations']['platform']['version'])")
            echo "== roles/$r:$v"
            az acr build -r "$ACR" -t "roles/$r:$v" -t "roles/$r:${GITHUB_SHA::7}" --build-arg "BASE_IMAGE=$ACR.azurecr.io/zakazka-app:p1" -f "$d/Dockerfile" "$d" --no-logs -o none
          done
      - name: build měřicího obrazu sandboxu S1 (az acr build)
        run: az acr build -r "$ACR" -t sandbox-s1:p1 -f infra/images/sandbox-s1/Dockerfile infra/images/sandbox-s1
      - run: az acr repository list -n "$ACR" -o table | tee -a "$GITHUB_STEP_SUMMARY"

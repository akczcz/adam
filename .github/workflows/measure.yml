# Měření P1 na AKS (spouští se ručně, čte ho i Claude přes GitHub API): stav podů platformy (Flux), S1 na Katě (S1h checky),
# e2e krok harnessu (p2-2: role jako Kata pody z obrazů rolí, konfigurace z Gitu; p2-1 bez obrazů rolí) + R1 rolegen v CI, výsledky jako artifact. Vyžaduje roli „Azure Kubernetes Service Cluster Admin Role“ pro identitu (Terraform, var deployer_principal_id).
name: measure
on:
  workflow_dispatch:
    inputs:
      s1:
        description: spustit S1 na Katě (tools/harness_sandbox_s1/aks)
        type: boolean
        default: true
      e2e:
        description: krok harnessu P1/P2 (zakázka end-to-end v AKS, role jako Kata pody; ~15–30 min, škáluje pool kata z 0) – none = jen stav
        type: choice
        default: none
        options: [none, p2-4, p2-3, p2-5, p2-2, p2-1]
permissions:
  id-token: write
  contents: read
jobs:
  measure:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev # OIDC subjekt repo:…:environment:dev má federaci; ref jiné větve než main ne
    env:
      RG: ${{ vars.TF_STATE_RG }}
      CLUSTER: aks-platform-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing
      - name: StatefulSety uvázlé na rozbitém podu (rolling update nenahradí pod v CrashLoopBackOff – kubernetes/kubernetes#67250) → smazat pody mimo updateRevision
        run: |
          for sts in $(kubectl -n platform-data get sts -o jsonpath='{.items[*].metadata.name}'); do
            cur=$(kubectl -n platform-data get sts "$sts" -o jsonpath='{.status.currentRevision}'); upd=$(kubectl -n platform-data get sts "$sts" -o jsonpath='{.status.updateRevision}')
            if [ -n "$upd" ] && [ "$cur" != "$upd" ]; then   # pod může stát i na mezilehlé revizi (ne currentRevision) – mazat vše, co není updateRevision
              for p in $(kubectl -n platform-data get pods -l "app=$sts,controller-revision-hash!=$upd" -o jsonpath='{.items[*].metadata.name}'); do echo "sts $sts: mažu pod $p (revize → $upd)"; kubectl -n platform-data delete pod "$p" --wait=false; done
            fi
          done
      - name: stav clusteru a platformy
        run: |
          { echo '## nodes'; kubectl get nodes -o wide; echo; echo '## runtimeclass'; kubectl get runtimeclass; echo; echo '## flux'; kubectl -n flux-system get kustomizations,gitrepositories 2>/dev/null || true; echo; echo '## pody platform-data'; kubectl -n platform-data get pods -o wide; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: S1 na Katě
        id: s1
        if: inputs.s1
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get install -y -q jq >/dev/null
          RG="$RG" CLUSTER="$CLUSTER" SKU=Standard_D4s_v5 S1_IMAGE="acrplatformdev${{ vars.NAME_SUFFIX }}.azurecr.io/sandbox-s1:p1" tools/harness_sandbox_s1/aks/run-s1-aks.sh run | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        if: inputs.e2e != 'none'
        with: {python-version: "3.12"}
      - name: R1 – rolegen bundle v CI (role → ClaudeAgentOptions, srt settings, gateway klíče, k8s pod, registr)
        if: inputs.e2e != 'none'
        run: |
          pip install -q pyyaml
          t0=$(date +%s.%N)
          python tools/rolegen/rolegen.py --roles knowledge/organization/roles --out "$RUNNER_TEMP/rolegen" --tenant acme --zakazka P2-ci
          t1=$(date +%s.%N)
          { echo "## R1 – rolegen v CI"; echo "čas: $(python -c "print(round($t1-$t0,2))") s"; echo '```'; find "$RUNNER_TEMP/rolegen" -type f | sed "s|$RUNNER_TEMP/rolegen/||" | sort; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: zakázka end-to-end v AKS (harness_p1_k8s --step ${{ inputs.e2e }})
        id: e2e
        if: inputs.e2e != 'none'
        continue-on-error: true
        run: |
          set -o pipefail
          pip install -q httpx pyyaml 'psycopg[binary]' 'PyJWT[crypto]' fastapi opentelemetry-sdk inspect-ai anthropic uvicorn pandas pyarrow   # fastapi/otel: embedding M1; inspect-ai…: negativní kontrola evalů (p2-5)
          python tools/harness_p1_k8s/harness.py --step "${{ inputs.e2e }}" --context "$CLUSTER-admin" --acr "acrplatformdev${{ vars.NAME_SUFFIX }}.azurecr.io" 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          { echo "## ${{ inputs.e2e }}"; echo '```'; grep -E "^  (✅|❌|ℹ️|⏭️)|^== výsledek" "$RUNNER_TEMP/e2e.log" | cut -c1-1500; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: diagnostika (pody, které nejsou Ready; události; s1-kata; autoscaler)
        if: always()
        run: |
          {
            echo '## diagnostika'
            echo '### Flux kustomizations (Ready, revize, zpráva) a revize StatefulSetů'; echo '```'
            kubectl -n flux-system get kustomizations -o jsonpath='{range .items[*]}{.metadata.name}{" applied="}{.status.lastAppliedRevision}{" attempted="}{.status.lastAttemptedRevision}{"\n"}{range .status.conditions[*]}{"  "}{.type}{"="}{.status}{" "}{.reason}{": "}{.message}{"\n"}{end}{end}' 2>&1 | cut -c1-1500
            kubectl -n platform-data get sts -o jsonpath='{range .items[*]}{.metadata.name}{" current="}{.status.currentRevision}{" update="}{.status.updateRevision}{" ready="}{.status.readyReplicas}{"\n"}{end}' 2>&1
            echo '```'
            for p in $(kubectl -n platform-data get pods --no-headers | awk '{split($2,a,"/")} a[1]!=a[2] || $3!="Running" {print $1}'); do
              echo "### pod $p"; echo '```'
              kubectl -n platform-data get pod "$p" -o jsonpath='{range .status.containerStatuses[*]}{.name}{" ready="}{.ready}{" restarts="}{.restartCount}{" state="}{.state}{" last="}{.lastState}{"\n"}{end}'
              kubectl -n platform-data logs "$p" --all-containers --tail=30 --prefix 2>&1 | tail -60
              echo '--- previous'; kubectl -n platform-data logs "$p" --all-containers --tail=20 --prefix --previous 2>&1 | tail -40
              echo '```'
            done
            echo '### události platform-data (posledních 40)'; echo '```'; kubectl -n platform-data get events --sort-by=.lastTimestamp 2>/dev/null | tail -40; echo '```'
            echo '### s1-kata'; echo '```'; kubectl get pod s1-kata -o wide 2>&1 || true; kubectl describe pod s1-kata 2>&1 | sed -n '/^Events:/,$p' | tail -25; echo '```'   # || true: bash -e by jinak ukončil celý blok (chybějící s1-kata)
            echo '### platform-roles (pody rolí, které zbyly; události)'; echo '```'; kubectl -n platform-roles get pods -o wide 2>&1; kubectl -n platform-roles get events --sort-by=.lastTimestamp 2>/dev/null | tail -30; echo '```'
            echo '### ledger aplikace (posledních 40 záznamů ROLE_POD*/AGENT_RUN/WF*)'; echo '```'; kubectl -n platform-data exec deploy/zakazka -c app -- sh -c 'grep -E "ROLE_POD|AGENT_RUN|ERROR" /data/ledger.jsonl | tail -40 | cut -c1-600' 2>&1; echo '```'
            echo '### autoscaler'; echo '```'; kubectl -n kube-system get configmap cluster-autoscaler-status -o jsonpath='{.data.status}' 2>/dev/null | head -60; echo; kubectl get events -A --field-selector reason=TriggeredScaleUp,reason=NotTriggerScaleUp,reason=FailedScaleUp 2>/dev/null | tail -10; echo '```'
            echo '### node pool kata'; echo '```'; az aks nodepool show -g "$RG" --cluster-name "$CLUSTER" -n kata --query '{state:provisioningState, count:count, min:minCount, max:maxCount, vm:vmSize}' -o table 2>&1; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ github.run_id }}
          path: |
            tools/harness_sandbox_s1/results/aks-*.json
            tools/harness_p1_k8s/results/p*-*.json
          if-no-files-found: ignore
      - name: výsledek
        if: always()
        run: |
          if [ "${{ inputs.s1 }}" = "true" ] && [ "${{ steps.s1.outcome }}" != "success" ]; then echo "S1 selhalo"; exit 1; fi
          if [ "${{ inputs.e2e }}" != "none" ] && [ "${{ steps.e2e.outcome }}" != "success" ]; then echo "${{ inputs.e2e }} selhalo"; exit 1; fi

# Měření P1 na AKS (spouští se ručně, čte ho i Claude přes GitHub API): stav podů platformy (Flux), S1 na Katě (S1h checky),
# výsledky jako artifact. Vyžaduje roli „Azure Kubernetes Service Cluster Admin Role“ pro identitu (Terraform, var deployer_principal_id).
name: measure
on:
  workflow_dispatch:
    inputs:
      s1:
        description: spustit S1 na Katě (tools/harness_sandbox_s1/aks)
        type: boolean
        default: true
permissions:
  id-token: write
  contents: read
jobs:
  measure:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev # OIDC subjekt repo:…:environment:dev má federaci; ref jiné větve než main ne
    env:
      RG: ${{ vars.TF_STATE_RG }}
      CLUSTER: aks-platform-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing
      - name: StatefulSety uvázlé na rozbitém podu (rolling update nenahradí pod v CrashLoopBackOff – kubernetes/kubernetes#67250) → smazat starý pod
        run: |
          for sts in $(kubectl -n platform-data get sts -o jsonpath='{.items[*].metadata.name}'); do
            cur=$(kubectl -n platform-data get sts "$sts" -o jsonpath='{.status.currentRevision}'); upd=$(kubectl -n platform-data get sts "$sts" -o jsonpath='{.status.updateRevision}')
            if [ -n "$upd" ] && [ "$cur" != "$upd" ]; then
              for p in $(kubectl -n platform-data get pods -l "controller-revision-hash=$cur" -o jsonpath='{.items[*].metadata.name}'); do echo "sts $sts: mažu pod $p (revize $cur → $upd)"; kubectl -n platform-data delete pod "$p" --wait=false; done
            fi
          done
      - name: stav clusteru a platformy
        run: |
          { echo '## nodes'; kubectl get nodes -o wide; echo; echo '## runtimeclass'; kubectl get runtimeclass; echo; echo '## flux'; kubectl -n flux-system get kustomizations,gitrepositories 2>/dev/null || true; echo; echo '## pody platform-data'; kubectl -n platform-data get pods -o wide; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: S1 na Katě
        id: s1
        if: inputs.s1
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get install -y -q jq >/dev/null
          RG="$RG" CLUSTER="$CLUSTER" SKU=Standard_D4s_v5 tools/harness_sandbox_s1/aks/run-s1-aks.sh run | tee -a "$GITHUB_STEP_SUMMARY"
      - name: diagnostika (pody, které nejsou Ready; události; s1-kata; autoscaler)
        if: always()
        run: |
          {
            echo '## diagnostika'
            for p in $(kubectl -n platform-data get pods --no-headers | awk '{split($2,a,"/")} a[1]!=a[2] || $3!="Running" {print $1}'); do
              echo "### pod $p"; echo '```'
              kubectl -n platform-data get pod "$p" -o jsonpath='{range .status.containerStatuses[*]}{.name}{" ready="}{.ready}{" restarts="}{.restartCount}{" state="}{.state}{" last="}{.lastState}{"\n"}{end}'
              kubectl -n platform-data logs "$p" --all-containers --tail=30 --prefix 2>&1 | tail -60
              echo '--- previous'; kubectl -n platform-data logs "$p" --all-containers --tail=20 --prefix --previous 2>&1 | tail -40
              echo '```'
            done
            echo '### události platform-data (posledních 40)'; echo '```'; kubectl -n platform-data get events --sort-by=.lastTimestamp 2>/dev/null | tail -40; echo '```'
            echo '### s1-kata'; echo '```'; kubectl get pod s1-kata -o wide 2>&1; kubectl describe pod s1-kata 2>&1 | sed -n '/^Events:/,$p' | tail -25; echo '```'
            echo '### autoscaler'; echo '```'; kubectl -n kube-system get configmap cluster-autoscaler-status -o jsonpath='{.data.status}' 2>/dev/null | head -60; echo; kubectl get events -A --field-selector reason=TriggeredScaleUp,reason=NotTriggerScaleUp,reason=FailedScaleUp 2>/dev/null | tail -10; echo '```'
            echo '### node pool kata'; echo '```'; az aks nodepool show -g "$RG" --cluster-name "$CLUSTER" -n kata --query '{state:provisioningState, count:count, min:minCount, max:maxCount, vm:vmSize}' -o table 2>&1; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ github.run_id }}
          path: tools/harness_sandbox_s1/results/aks-*.json
          if-no-files-found: ignore
      - name: výsledek
        if: always()
        run: |
          if [ "${{ inputs.s1 }}" = "true" ] && [ "${{ steps.s1.outcome }}" != "success" ]; then echo "S1 selhalo"; exit 1; fi

# Provozní úkony dev prostředí (šetření: AKS stop = uzly se neúčtují; Flexible Server stop = max. 7 dní, pak se sám zapne).
# Spouští se ručně; Claude ho může spustit přes GitHub API. Jména zdrojů = Terraform (infra/terraform/variables.tf, main.tf).
name: cluster
on:
  workflow_dispatch:
    inputs:
      action:
        description: stop | start | status | live-sync (ostrá tajemství anthropic-api-key/github-token z Key Vaultu do běžícího clusteru – ESO force-sync, nové pody gateway a aplikace, předletová kontrola) | diag (diagnostika telemetrie – Collector, ClickHouse, gateway; nic nemění) | clickhouse-retention (úklid systémových logů ClickHouse a TTL otel tabulek – harness --ch-retention)
        default: status
        type: choice
        options: [stop, start, status, live-sync, diag, clickhouse-retention, stop-zakazky]
      tag:
        description: diag – prefix zakázek běhu harnessu (např. P31-071221); prázdné = jen stav podů a logy. stop-zakazky – ID zakázek oddělená čárkou (úklid zombie zakázek, nález 18)
        default: ''
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  cluster:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev # OIDC subjekt repo:…:environment:dev má federaci; ref jiné větve než main ne
    env:
      RG: ${{ vars.TF_STATE_RG }}
      CLUSTER: aks-platform-dev
      PG: pg-platform-dev-${{ vars.NAME_SUFFIX }}-${{ vars.AZURE_LOCATION || 'polandcentral' }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # idempotentní: start/stop jen když je zdroj v opačném stavu (PG „Stopping“ těsně po stopu → start ho nezachytí, viz 2026-10-25); čeká na dokončení přechodu
      - if: inputs.action == 'stop'
        run: |
          aks=$(az aks show -g "$RG" -n "$CLUSTER" --query powerState.code -o tsv); [ "$aks" = "Running" ] && az aks stop -g "$RG" -n "$CLUSTER" -o none && echo "AKS stopped" || echo "AKS: $aks"
          for i in $(seq 1 30); do pg=$(az postgres flexible-server show -g "$RG" -n "$PG" --query state -o tsv); case "$pg" in Starting|Stopping|Updating) sleep 20;; *) break;; esac; done
          [ "$pg" = "Ready" ] && az postgres flexible-server stop -g "$RG" -n "$PG" -o none && echo "PG stopped" || echo "PG: $pg"
      - if: inputs.action == 'start'
        run: |
          for i in $(seq 1 30); do pg=$(az postgres flexible-server show -g "$RG" -n "$PG" --query state -o tsv); case "$pg" in Starting|Stopping|Updating) sleep 20;; *) break;; esac; done
          [ "$pg" = "Stopped" ] && az postgres flexible-server start -g "$RG" -n "$PG" -o none && echo "PG started" || echo "PG: $pg"
          aks=$(az aks show -g "$RG" -n "$CLUSTER" --query powerState.code -o tsv); [ "$aks" = "Stopped" ] && az aks start -g "$RG" -n "$CLUSTER" -o none && echo "AKS started" || echo "AKS: $aks"
      # diag (P4-8, běhy 2–3: E4a ztracené spany bez restartu Collectoru): stav a logy Collectoru/ClickHouse, spany gateway v ClickHouse
      # per zakázka × role a bez atributu zakazka, requesty v logu gateway, události ledgeru (STOP/RESUME tenanta, klíče). Jen čtení.
      - if: inputs.action == 'diag'
        run: az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing
      - if: inputs.action == 'diag'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set +e
          ns=platform-data
          { echo '## pody telemetrie'; kubectl -n $ns get pods -o wide | grep -E 'NAME|otel-collector|clickhouse|agentgateway'
            kubectl -n $ns top pod 2>&1 | grep -E 'NAME|otel-collector|clickhouse|agentgateway'
            for p in $(kubectl -n $ns get pods -o name | grep -E 'otel-collector|clickhouse'); do
              echo "### $p"; kubectl -n $ns get "$p" -o jsonpath='{range .status.containerStatuses[*]}{.name}{" restarts="}{.restartCount}{" state="}{.state}{" last="}{.lastState}{"\n"}{end}'
              kubectl -n $ns get "$p" -o jsonpath='{range .spec.containers[*]}{.name}{" "}{.resources}{"\n"}{end}'
              echo '--- log: chyby/varování (posledních 60 z 3000)'; kubectl -n $ns logs "$p" --all-containers --tail=3000 2>&1 | grep -iE 'error|warn|drop|refus|fail|exceed|memory|retry' | tail -60 | cut -c1-600
              echo '--- previous (posledních 20)'; kubectl -n $ns logs "$p" --all-containers --tail=20 --previous 2>&1 | cut -c1-400
            done
            echo '### události otel-collector/clickhouse'; kubectl -n $ns get events --sort-by=.lastTimestamp 2>/dev/null | grep -E 'otel-collector|clickhouse' | tail -20
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$TAG" ] && { { echo "## poslední zakázky (ledger ZAKAZKA_START) a HITL (posledních 40 událostí)"
            kubectl -n $ns exec deploy/zakazka -c app -- sh -c "grep -aE 'ZAKAZKA_START' /data/ledger.jsonl | tail -10 | cut -c1-300; echo; grep -aE 'HITL|DIALOG|KLASIFIKACE|ZAKAZKA_|PUBLISH|APPROVAL|AGENT_RUN|ROLE_POD|STOP|MANDAT' /data/ledger.jsonl | tail -60 | cut -c1-600" 2>&1
            } | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          kubectl -n cert-manager get secret platform-root-ca -o jsonpath='{.data.ca\.crt}' | base64 -d > "$RUNNER_TEMP/ca.crt"
          kubectl -n $ns port-forward svc/clickhouse 18445:8443 >/dev/null 2>&1 & PF=$!; sleep 6
          q() { curl -sS --max-time 60 --cacert "$RUNNER_TEMP/ca.crt" --resolve clickhouse.platform-data.svc:18445:127.0.0.1 "https://clickhouse.platform-data.svc:18445/" --data-binary "$1 FORMAT PrettyCompactNoEscapes" 2>&1 | cut -c1-400; }
          { echo "## ClickHouse – spany gateway zakázek $TAG* (per zakázka × role)"
            q "SELECT SpanAttributes['zakazka'] z, SpanAttributes['role'] r, count() n, round(sum(toFloat64OrZero(SpanAttributes['llm.cost.total'])),6) usd, min(Timestamp) t0, max(Timestamp) t1, countIf(StatusCode!='Ok' AND StatusCode!='Unset') err FROM otel.otel_traces WHERE ServiceName='agentgateway' AND z LIKE '$TAG%' GROUP BY z,r ORDER BY z,r"
            echo "## spany gateway bez atributu zakazka (posledních 6 h) – kam by se mohly ztratit"
            q "SELECT SpanName, StatusCode, count() n, round(sum(toFloat64OrZero(SpanAttributes['llm.cost.total'])),6) usd, min(Timestamp) t0, max(Timestamp) t1 FROM otel.otel_traces WHERE ServiceName='agentgateway' AND Timestamp > now()-INTERVAL 6 HOUR AND SpanAttributes['zakazka']='' GROUP BY 1,2 ORDER BY n DESC"
            q "SELECT Timestamp, SpanName, StatusCode, mapKeys(SpanAttributes) ks FROM otel.otel_traces WHERE ServiceName='agentgateway' AND Timestamp > now()-INTERVAL 6 HOUR AND SpanAttributes['zakazka']='' ORDER BY Timestamp DESC LIMIT 8"
            echo "## spany gateway zakázek $TAG* v čase (všechny, po 1)"
            q "SELECT Timestamp, SpanAttributes['zakazka'] z, SpanAttributes['role'] r, SpanName, StatusCode, SpanAttributes['llm.cost.total'] usd, round(Duration/1e6) ms, SpanAttributes['http.response.status_code'] http FROM otel.otel_traces WHERE ServiceName='agentgateway' AND z LIKE '$TAG%' ORDER BY Timestamp LIMIT 400"
            echo "## spany gateway po 10 min (posledních 6 h) vs. memory-server"
            q "SELECT toStartOfInterval(Timestamp, INTERVAL 10 minute) t, ServiceName, count() n FROM otel.otel_traces WHERE Timestamp > now()-INTERVAL 6 HOUR GROUP BY t, ServiceName ORDER BY t, ServiceName"
            echo "## log gateway – requesty zakázek $TAG* (JSON pole zakazka/role/status; shrnutí per zakázka × role × status + posledních 40 řádků zakázek s rozdílem)"
            for p in $(kubectl -n $ns get pods -o name | grep agentgateway); do
              echo "### $p"; kubectl -n $ns logs "$p" -c agentgateway --tail=-1 2>/dev/null | grep -F "$TAG" > "$RUNNER_TEMP/gw.log"; wc -l < "$RUNNER_TEMP/gw.log"
              head -c 700 "$RUNNER_TEMP/gw.log"; echo
              python3 - "$RUNNER_TEMP/gw.log" <<'PY'
          import sys, json, collections
          c = collections.Counter(); keys = set()
          for l in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try: j = json.loads(l[l.index("{"):]) if "{" in l else {}
              except Exception: j = {}
              if not j: continue
              keys |= set(j)
              z = j.get("zakazka") or ""; r = j.get("role") or ""
              st = next((j[k] for k in j if "status" in k.lower()), "?")
              c[(z, r, str(st), j.get("http.path") or j.get("path") or j.get("http.url") or "")] += 1
          print("keys:", sorted(keys)[:60])
          for k, n in sorted(c.items()): print(n, *k)
          PY
            done
            echo "## ledger aplikace – tenant stop/resume, klíče, zabité pody ($TAG*)"
            kubectl -n $ns exec deploy/zakazka -c app -- sh -c "grep -aE 'STOP_TENANT|RESUME_TENANT|GATEWAY_KEYS|ROLE_POD_KILLED|ROLE_CHECKPOINT|ROLE_STOPPED' /data/ledger.jsonl | grep -aF '$TAG' | tail -40 | cut -c1-500" 2>&1
            # 2026-11-19 (ruční ostrá zakázka): průběh zakázky pro podporu bez kubectl; grep -a: ledger může nést binární bajt (grep by skončil „binary file matches“) – HITL/dialog/role/publikace (bez tokenů: ledger je nenese), log aplikace
            echo "## ledger aplikace – průběh zakázek $TAG* (HITL, dialog, role, publikace, stav; posledních 80)"
            kubectl -n $ns exec deploy/zakazka -c app -- sh -c "grep -aF '$TAG' /data/ledger.jsonl | grep -avE 'GATEWAY_KEYS|MEMORY_|FINOPS_|SPAN' | tail -80 | cut -c1-700" 2>&1
            # 2026-11-22 (eval scénář 3, Z-11220949): kompaktní osa celé zakázky (úkoly, kola review, verdikty, chyby) a plné příkazy rolí z AGENT_RUN.calls –
            # 700 znaků na řádek nestačí, když Vývojář vyčerpá kola (24 příkazů), a ledger se čte jen přes tento workflow
            kubectl -n $ns exec deploy/zakazka -c app -- sh -c "grep -aF '$TAG' /data/ledger.jsonl | grep -aE '\"kind\": \"(NOTIFY|HANDOFF|AGENT_RUN|ROLE_POD|PUBLISHED|APPROVAL_RAISED|DIALOG_RAISED|ARTIFACT_MISSING|BUDGET_EXCEEDED|REGISTRY_ZAKAZKA)\"'" > "$RUNNER_TEMP/zak.jsonl" 2>/dev/null || true
            echo "## osa zakázek $TAG* (čas od založení; AGENT_RUN: kola, cena, chyba; HANDOFF: úkol/kolo/verdikt/soubory)"
            python3 - "$RUNNER_TEMP/zak.jsonl" <<'PY'
          import json, sys, time
          ev = []
          for l in open(sys.argv[1], encoding="utf-8", errors="replace"):
              try: ev.append(json.loads(l))
              except Exception: pass
          t0 = min((e.get("ts") or 0) for e in ev) if ev else 0
          def T(e): return f"{(e.get('ts', 0) - t0) / 60:6.1f}m"
          for e in ev:
              k = e.get("kind"); r = e.get("role") or e.get("frm") or ""
              if k == "NOTIFY": print(T(e), "NOTIFY", e.get("event"), e.get("bod") or "", r, {x: e[x] for x in ("n", "total", "nazev", "task", "round", "verdict", "attempt", "error", "rounds", "reason") if e.get(x) is not None})
              elif k == "HANDOFF": print(T(e), "HANDOFF", f"{e.get('frm')}→{e.get('to')}", {x: e[x] for x in ("task", "round", "verdict", "files", "error", "plan", "tasks", "file_exists", "retried", "cost_usd") if e.get(x) is not None})
              elif k == "AGENT_RUN": print(T(e), "AGENT_RUN", r, f"turns={e.get('num_turns')} tools={len(e.get('tool_uses') or [])} cost={e.get('cost_usd')} err={str(e.get('error') or e.get('is_error') or '')[:160]}", "text=" + str(e.get("result_text") or "")[:200].replace("\n", " "))
              elif k == "ROLE_POD": print(T(e), "ROLE_POD", r, e.get("phase"), f"exit={e.get('exit_code')} reason={e.get('reason')} result_received={e.get('result_received')}")
              elif k in ("PUBLISHED", "APPROVAL_RAISED", "DIALOG_RAISED", "ARTIFACT_MISSING", "BUDGET_EXCEEDED", "REGISTRY_ZAKAZKA"): print(T(e), k, e.get("bod") or e.get("publish_kind") or e.get("status") or "", str(e.get("reason") or e.get("url") or e.get("answer") or e.get("detail") or e.get("required") or "")[:200])
          print("## příkazy rolí (AGENT_RUN.calls – cmd/path, rc, stdout/stderr zkráceně)")
          for e in ev:
              if e.get("kind") != "AGENT_RUN": continue
              print(f"--- {T(e)} {e.get('role')} task={e.get('task')} round={e.get('round')} turns={e.get('num_turns')}")
              for c in e.get("calls") or []:
                  what = c.get("cmd") or c.get("path") or json.dumps(c.get("args"), ensure_ascii=False) if (c.get("cmd") or c.get("path") or c.get("args")) else ""
                  out = str(c.get("stdout") or c.get("out") or c.get("stderr") or c.get("error") or "")
                  print("  ", c.get("tool"), "|", what[:400].replace("\n", " ⏎ "), "| rc", c.get("exit", c.get("ok", c.get("http"))), "|", out[-240:].replace("\n", " ⏎ ") if out else "")
          PY
            echo "## log aplikace – chyby a HITL (posledních 60 z 4000)"
            kubectl -n $ns logs deploy/zakazka -c app --tail=4000 2>&1 | grep -iE 'error|traceback|hitl|approve|reject|interrupt|403|401|422' | grep -F "$TAG" | tail -60 | cut -c1-500
            # 2026-11-23 (eval scénář 4, Z-11231015): Resume tenanta z GUI „nic neukázal“ – handler prochází stav všech zakázek tenanta a Cloudflare požadavek
            # po 100 s utne; události tenanta nenesou ID zakázky (filtr tagu je skryl). Proto stav instance Dapr přímo z API aplikace, události tenanta
            # a chyby aplikace bez filtru tagu.
            echo "## stav instance $TAG (API aplikace: Dapr runtime status, výstup, failure)"
            kubectl -n $ns exec deploy/zakazka -c app -- python3 -c "import json,urllib.request,sys; print(json.dumps(json.load(urllib.request.urlopen('http://127.0.0.1:8010/zakazky/'+sys.argv[1], timeout=60)), ensure_ascii=False)[:1200])" "$TAG" 2>&1 | tail -3
            echo "## ledger aplikace – stop/resume tenanta a zakázek bez filtru tagu (posledních 15)"
            kubectl -n $ns exec deploy/zakazka -c app -- sh -c "grep -aE '\"kind\": \"(STOP|RESUME|STOP_TENANT|RESUME_TENANT|STOP_TENANT_ERROR|RESUME_TENANT_ERROR|ROLE_STOPPED)\"' /data/ledger.jsonl | tail -15 | cut -c1-600" 2>&1
            echo "## pody rolí v namespaces tenantů (zombie zakázky po resume tenanta – nález 18)"
            kubectl get pods -A -l app=role -o custom-columns='NS:.metadata.namespace,POD:.metadata.name,ZAKAZKA:.metadata.labels.platform\.zakazka,PHASE:.status.phase,START:.status.startTime' 2>&1 | head -40
            echo "## poslední RESUME_TENANT celý + stav obnovených zakázek z API"
            kubectl -n $ns exec deploy/zakazka -c app -- python3 - <<'PY' 2>&1 | tail -60
          import json, urllib.request
          last = None
          for l in open("/data/ledger.jsonl", "rb"):
              if b'"kind": "RESUME_TENANT"' in l:
                  try: last = json.loads(l)
                  except Exception: pass
          print(json.dumps(last, ensure_ascii=False)[:3000] if last else "žádný RESUME_TENANT")
          for z in (last or {}).get("resumed") or []:
              try: j = json.load(urllib.request.urlopen("http://127.0.0.1:8010/zakazky/" + z, timeout=30)); print(z, j.get("status"), (j.get("output") or {}).get("stav"), (j.get("output") or {}).get("bod"))
              except Exception as e: print(z, "chyba", type(e).__name__, str(e)[:80])
          PY
            echo "## log aplikace – chyby bez filtru tagu (posledních 25 z 4000)"
            kubectl -n $ns logs deploy/zakazka -c app --tail=4000 2>&1 | grep -iE 'error|traceback|exception|timeout' | grep -viE 'ROLE_POD_ERROR|egress_probe' | tail -25 | cut -c1-500
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          kill "$PF" 2>/dev/null; true
      # clickhouse-retention (P4-8 běh 3): plný PVC ClickHouse → Collector zahazoval spany. Stejný kód jako na startu měření (harness ch_retention):
      # DROP systémových logů vypnutých v platform.xml, TTL 7 d u otel tabulek bez TTL, stav disku před/po. Cluster musí běžet.
      - if: inputs.action == 'clickhouse-retention'
        uses: actions/checkout@v4
      - if: inputs.action == 'clickhouse-retention'
        run: az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing
      - if: inputs.action == 'clickhouse-retention'
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: inputs.action == 'clickhouse-retention'
        run: |
          set -o pipefail
          pip install -q httpx pyyaml 'psycopg[binary]' 'PyJWT[crypto]' cryptography certifi
          python tools/harness_p1_k8s/harness.py --ch-retention --context "$CLUSTER-admin" 2>&1 | tee "$RUNNER_TEMP/ch.log"
          { echo "## retence ClickHouse"; echo '```'; grep -E "^(✅|❌)" "$RUNNER_TEMP/ch.log" | cut -c1-3000; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # stop-zakazky (2026-11-23, eval scénář 4, nález 18): resume tenanta acme ze staré verze aplikace obnovil desítky zakázek harnessu zastavených
      # „úklid po měření“ – ty teď spouštějí pody rolí (Kata uzel sdílený s ostrou zakázkou). Stop jednotlivých zakázek interním API aplikace
      # (stejná cesta jako úklid harnessu): pause workflow + ukončení podů; důvod v ledgeru STOP (by=cluster-workflow).
      - if: inputs.action == 'stop-zakazky'
        name: stop-zakazky
        run: |
          set +e
          [ -n "${{ inputs.tag }}" ] || { echo "stop-zakazky: tag = ID zakázek oddělená čárkou" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing -o none
          echo "## stop-zakazky" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n platform-data exec -i deploy/zakazka -c app -- python3 - "${{ inputs.tag }}" <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys, urllib.request
          for z in [x.strip() for x in sys.argv[1].split(",") if x.strip()]:
              try:
                  st = json.load(urllib.request.urlopen("http://127.0.0.1:8010/zakazky/" + z, timeout=30)).get("status")
                  if st != "RUNNING": print(z, "přeskočeno: stav", st); continue
                  req = urllib.request.Request("http://127.0.0.1:8010/zakazky/" + z + "/stop", data=json.dumps({"by": "cluster-workflow", "reason": "úklid: zakázka harnessu obnovená omylem resume tenanta (nález 18)"}).encode(), headers={"Content-Type": "application/json"}, method="POST")
                  print(z, json.dumps(json.load(urllib.request.urlopen(req, timeout=120)), ensure_ascii=False)[:300])
              except Exception as e: print(z, "chyba", type(e).__name__, str(e)[:160])
          PY
      # live-sync (P4-10, 2026-11-19): Adam nastavil ostré hodnoty v Key Vaultu až po startu clusteru → bez kubectl nešlo vynutit ESO sync a nové pody
      # (klíč modelu je env gateway i aplikace; PAT je soubor gateway – watched). Anotace force-sync na třech ExternalSecretech, čekání na refreshTime,
      # rollout restart gateway + aplikace; hodnoty se nikam nevypisují (jen „výchozí (mock)“ / „nastavena“). Předletová kontrola je ve kroku níže.
      - if: inputs.action == 'live-sync'
        name: live-sync
        run: |
          set +e
          [ "$(az aks show -g "$RG" -n "$CLUSTER" --query powerState.code -o tsv)" = "Running" ] || { echo "live-sync: cluster neběží – nejdřív start" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing -o none
          ns=platform-data; t0=$(date +%s)
          for es in agentgateway-secrets agentgateway-github-token zakazka-secrets; do kubectl -n $ns annotate externalsecret $es "force-sync=$t0" --overwrite >/dev/null; done
          for i in $(seq 1 60); do
            ok=1; for es in agentgateway-secrets agentgateway-github-token zakazka-secrets; do
              rt=$(kubectl -n $ns get externalsecret $es -o jsonpath='{.status.refreshTime}' 2>/dev/null); [ -n "$rt" ] && [ "$(date -d "$rt" +%s)" -ge $((t0-5)) ] || ok=0; done
            [ $ok = 1 ] && break; sleep 3; done
          { echo "## live-sync"; echo "ESO sync: $([ $ok = 1 ] && echo "hotovo za $(( $(date +%s) - t0 )) s" || echo "nedokončeno do 180 s – zkontroluj ExternalSecrety (cluster diag)")"
            k=$(kubectl -n $ns get secret agentgateway-secrets -o jsonpath='{.data.ANTHROPIC_API_KEY}' | base64 -d); [ "$k" = "sk-ant-harness-mock" ] && echo "anthropic-api-key: výchozí (mock) – nastav v Key Vaultu novou verzi a spusť live-sync znovu" || echo "anthropic-api-key: nastavena (${#k} znaků)"
            t=$(kubectl -n $ns get secret agentgateway-github-token -o jsonpath='{.data.token}' | base64 -d); [ "$t" = "mock-github-token" ] && echo "github-token: výchozí (mock) – nastav v Key Vaultu novou verzi a spusť live-sync znovu" || echo "github-token: nastaven (${#t} znaků)"
            unset k t
          } | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n $ns rollout restart deploy/agentgateway deploy/zakazka >/dev/null
          kubectl -n $ns rollout status deploy/agentgateway --timeout=300s 2>&1 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n $ns rollout status deploy/zakazka --timeout=420s 2>&1 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          sleep 20   # sidecar tunelu a listener aplikace po startu podu
      - name: status
        run: |
          { echo "## $CLUSTER"; az aks show -g "$RG" -n "$CLUSTER" --query '{power:powerState.code, k8s:kubernetesVersion, provisioning:provisioningState}' -o table
            az aks nodepool list -g "$RG" --cluster-name "$CLUSTER" --query '[].{pool:name, vm:vmSize, count:count, min:minCount, max:maxCount, runtime:workloadRuntime, state:powerState.code}' -o table
            echo; echo "## $PG"; az postgres flexible-server show -g "$RG" -n "$PG" --query '{state:state, sku:sku.name, version:version}' -o table; } | tee -a "$GITHUB_STEP_SUMMARY"
      # adresa GUI pro člověka (P4-4 tunel): pojmenovaný tunnel = hostname ze Secretu cloudflare-tunnel, quick tunnel = *.trycloudflare.com z logu sidecaru
      # (nový hostname po každém restartu podu). Jen když cluster běží; po `start` trvá start podu aplikace několik minut → `status` znovu.
      - name: adresa GUI
        run: |
          set +e
          [ "$(az aks show -g "$RG" -n "$CLUSTER" --query powerState.code -o tsv)" = "Running" ] || { echo "GUI: cluster neběží"; exit 0; }
          az aks get-credentials -g "$RG" -n "$CLUSTER" --admin --overwrite-existing -o none
          host=$(kubectl -n platform-data get secret cloudflare-tunnel -o jsonpath='{.data.hostname}' 2>/dev/null | base64 -d)
          url=""; [ -n "$host" ] && [ "$host" != "quick" ] && url="https://$host"
          if [ -z "$url" ]; then
            pod=$(kubectl -n platform-data get pods -l app=zakazka --field-selector=status.phase=Running --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | tail -1)
            [ -n "$pod" ] && url=$(kubectl -n platform-data logs "$pod" -c cloudflared --tail=400 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1)
          fi
          # P4-10: pojmenovaný tunnel + Cloudflare Access – před GUI přihlášení e-mailem (OTP) do Access, pak Keycloak; origin ověřuje Access JWT (access=True v /health)
          acc=$(kubectl -n platform-data get secret cloudflare-access -o jsonpath='{.data.aud}' 2>/dev/null | base64 -d); [ -n "$acc" ] && [ "$acc" != "none" ] && acc="Cloudflare Access (nejdřív e-mail OTP), pak " || acc=""
          { echo "## GUI"
            if [ -n "$url" ]; then echo "$url/gui – ${acc}přihlášení uživatelem z Keycloaku (adam = tenant acme, bea = beta, platform-admin), heslo v Key Vaultu \`kc-user-<jméno>-password\`"
            else echo "URL tunelu zatím není (pod aplikace startuje) – spusť \`status\` za 2–3 min"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # předletová kontrola ostrého běhu (P4-2 /_live): ok=True = klíč modelu / PAT z Key Vaultu platí (1 token), wired=True + 401 = cesta funguje, hodnoty výchozí (mock)
          case "${{ inputs.action }}" in status|live-sync) ;; *) exit 0;; esac
          kubectl -n platform-data exec -i deploy/zakazka -c app -- python3 - <<'PY' 2>&1 | sed 's/^/ostrá tajemství: /' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, urllib.request
          for p in ("model", "github"):
              try:
                  j = json.load(urllib.request.urlopen("http://127.0.0.1:8010/_live/" + p, timeout=90))
                  print(p, "ok=%s status=%s wired=%s" % (j.get("ok"), j.get("status"), j.get("wired")), "" if j.get("ok") else "(ostrý běh neprojde – hodnota v Key Vaultu je výchozí nebo ESO ještě nesynchronizovalo)")
              except Exception as e:
                  print(p, "chyba %s: %s" % (type(e).__name__, str(e)[:120]))
          try:   # P4-10: veřejný listener – access=True = origin ověřuje JWT Cloudflare Access (pojmenovaný tunnel), False = quick tunnel bez Access
              j = json.load(urllib.request.urlopen("http://127.0.0.1:8011/health", timeout=30)); print("vstup", "access=%s" % j.get("access"), "" if j.get("access") else "(quick tunnel bez Access – postup P4-10 v p4-provoz.md)")
          except Exception as e:
              print("vstup", "chyba %s: %s" % (type(e).__name__, str(e)[:120]))
          PY
          # 2026-11-22 (eval scénář 3): konfigurace z Gitu = větev Fluxu; změna ConfigMapy na jiné větvi (P0_MAX_TURNS) se nasadí až po merge – ať je vidět, co v clusteru platí
          { echo "konfigurace: Flux větev $(kubectl -n flux-system get gitrepository platform -o jsonpath='{.spec.ref.branch}' 2>/dev/null || echo ?) rev $(kubectl -n flux-system get gitrepository platform -o jsonpath='{.status.artifact.revision}' 2>/dev/null | sed 's/.*sha1://' | cut -c1-12); zakazka pod $(kubectl -n platform-data get pods -l app=zakazka --field-selector=status.phase=Running -o jsonpath='{.items[-1:].metadata.creationTimestamp}' 2>/dev/null) mount /tmp/p0-o2 = $(kubectl -n platform-data get deploy zakazka -o jsonpath='{.spec.template.spec.containers[?(@.name=="app")].volumeMounts[?(@.mountPath=="/tmp/p0-o2")]}' 2>/dev/null); zakazka-env P0_MAX_TURNS=$(kubectl -n platform-data get cm zakazka-env -o jsonpath='{.data.P0_MAX_TURNS}' 2>/dev/null) P0_MODEL=$(kubectl -n platform-data get cm zakazka-env -o jsonpath='{.data.P0_MODEL}' 2>/dev/null)"; } | tee -a "$GITHUB_STEP_SUMMARY"

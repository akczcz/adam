kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform
nodes:
- role: control-plane
  image: kindest/node:v1.37.0-noom   # vlastní obraz: runc obal bez oomScoreAdj (hostitel bez CAP_SYS_RESOURCE)
  extraPortMappings:
  - containerPort: 30432   # postgres NodePort
    hostPort: 30432
  - containerPort: 30900   # clickhouse native
    hostPort: 30900
  - containerPort: 30123   # clickhouse http
    hostPort: 30123
  - containerPort: 30317   # otel grpc
    hostPort: 30317
  - containerPort: 30318   # otel http
    hostPort: 30318
  - containerPort: 30080   # keycloak (P1-3)
    hostPort: 30080
  - containerPort: 30200   # openbao (P1-3)
    hostPort: 30200
  - containerPort: 30410   # agentgateway LLM (P1-4)
    hostPort: 30410
  - containerPort: 30810   # zakazka app (P1-5)
    hostPort: 30810
  - containerPort: 30990   # memory (P1-5)
    hostPort: 30990
kubeadmConfigPatches:
- |
  kind: KubeletConfiguration
  failCgroupV1: false   # hostitel harnessu má cgroup v1; na AKS/Azure Linux netřeba
containerdConfigPatches:
- |
  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
    BinaryName = "/usr/local/bin/runc-noom"

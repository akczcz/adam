apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
# Flux extension AKS vynucuje multi-tenancy (HelmRelease bez serviceAccountName by běžel jako SA `default` svého namespace a chart s CRD/ClusterRole
# by nenainstaloval; sourceRef jen ve vlastním namespace). Operátoři CRD a ClusterRole potřebují → vlastní SA s cluster-admin per namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-helm
  namespace: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-helm
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-helm-operators
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
- {kind: ServiceAccount, name: flux-helm, namespace: cert-manager}
- {kind: ServiceAccount, name: flux-helm, namespace: external-secrets}

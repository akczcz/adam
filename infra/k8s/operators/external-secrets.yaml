# External Secrets Operator v2.14.0 (Apache-2.0, CNCF sandbox; releasy obnoveny 2025-09-22 po pauze maintainerů – ověřeno 2026-10-27).
# Nese bootstrap tajemství z Key Vaultu (zapisuje Terraform, infra/terraform/secrets.tf) do Secretů platformy (overlays/aks/secrets-eso.yaml).
# Jediný obraz pro controller, webhook i cert-controller. Podporovaná je jen aktuální minor → verzi držet pinovanou a zvedat po jedné.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  type: oci
  url: oci://ghcr.io/external-secrets/charts
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  timeout: 10m
  serviceAccountName: flux-helm
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"
      sourceRef: {kind: HelmRepository, name: external-secrets}
  install: {crds: CreateReplace, remediation: {retries: 3}}
  upgrade: {crds: CreateReplace, remediation: {retries: 3}}
  values:
    installCRDs: true
    image: {repository: "${ACR_LOGIN_SERVER}/external-secrets", tag: v2.14.0}
    webhook:
      image: {repository: "${ACR_LOGIN_SERVER}/external-secrets", tag: v2.14.0}
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
    certController:
      image: {repository: "${ACR_LOGIN_SERVER}/external-secrets", tag: v2.14.0}
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
    resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}

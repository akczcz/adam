# P3-6 E1: tajemství a certifikáty platformy nevydává harness ani Flux substitute, ale operátoři (kustomizace operators/trust):
# - cert-manager: Certificate agentgateway-tls (ClusterIssuer platform-ca) → Secret kubernetes.io/tls pro HTTPS listenery git/mirror.platform.internal
#   (rotace leafu automaticky; gateway nový cert načte až restartem podů – ověřit při rotaci),
# - ESO: ExternalSecrety z Key Vaultu (ClusterSecretStore azure-kv; hodnoty zapisuje Terraform infra/terraform/secrets.tf) → Secrety se stejnými
#   jmény a klíči, jaké komponenty čekaly dosud; existující Secret bez vlastníka ESO převezme (ownerReference), takže migrace z harnessu je bez výpadku.
# Šablony ESO ({{ .x }}) nejsou proměnné Flux (${X}) – substitute je nechá být.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentgateway-tls
spec:
  secretName: agentgateway-tls
  duration: 2160h
  renewBeforePercentage: 33
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  dnsNames: [git.platform.internal, mirror.platform.internal]
  issuerRef: {name: platform-ca, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-auth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target: {name: postgres-auth, creationPolicy: Owner}
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef: {key: pg-platform-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-git-token
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target: {name: agentgateway-git-token, creationPolicy: Owner}
  data:
  - secretKey: token
    remoteRef: {key: git-backend-token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: agentgateway-secrets
    creationPolicy: Owner
    template:
      data:
        ANTHROPIC_API_KEY: "{{ .api_key }}"
        AGW_DATABASE_URL: "postgresql://platform:{{ .pg }}@postgres:5432/agentgateway?sslmode=require"
  data:
  - {secretKey: pg, remoteRef: {key: pg-platform-password}}
  - {secretKey: api_key, remoteRef: {key: anthropic-api-key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zakazka-finops
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: zakazka-finops
    creationPolicy: Owner
    template:
      data:
        P0_FINOPS_DSN: "postgresql://platform:{{ .pg }}@postgres:5432/agentgateway?sslmode=require"
        P0_REGISTRY_DSN: "postgresql://platform:{{ .pg }}@postgres:5432/org?sslmode=require"
        # P3-6 E9: hesla RLS rolí – aplikace (vlastník schématu) je při startu nastaví ALTER ROLE; paměť a Governance MCP je dostanou v DSN níže
        P0_DB_ROLE_PASSWORDS: '{"memory_app": "{{ .memory_app }}", "org_reader": "{{ .org_reader }}", "org_writer": "{{ .org_writer }}"}'
  data:
  - {secretKey: pg, remoteRef: {key: pg-platform-password}}
  - {secretKey: memory_app, remoteRef: {key: pg-memory-app-password}}
  - {secretKey: org_reader, remoteRef: {key: pg-org-reader-password}}
  - {secretKey: org_writer, remoteRef: {key: pg-org-writer-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zakazka-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: zakazka-secrets
    creationPolicy: Owner
    template:
      data:
        P0_ROLE_CLIENT_SECRETS: "{{ .role_clients }}"
        P0_API_KEY: "{{ .api_key }}"
        BRIDGE_WEBHOOK_SECRET: "{{ .webhook }}"
        P0_ROLE_KEYS: "{}"
  data:
  - {secretKey: role_clients, remoteRef: {key: role-client-secrets}}
  - {secretKey: api_key, remoteRef: {key: anthropic-api-key}}
  - {secretKey: webhook, remoteRef: {key: bridge-webhook-secret}}
---
# P3-6 E9: žádný literál hesla z Gitu v běžící platformě – admin Keycloaku a DSN paměti/Governance MCP z Key Vaultu (Terraform random_password);
# base Secrety keycloak-admin, memory-db, governance-db (dev hodnoty pro kind) overlay maže (kustomization.yaml $patch: delete)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: keycloak-admin
    creationPolicy: Owner
    template:
      data:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ .pw }}"
  data:
  - {secretKey: pw, remoteRef: {key: keycloak-admin-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-db
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: memory-db
    creationPolicy: Owner
    template:
      data:
        MEMORY_DB_URI: "postgresql://memory_app:{{ .pw }}@postgres:5432/memory?sslmode=require"
  data:
  - {secretKey: pw, remoteRef: {key: pg-memory-app-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: governance-db
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: governance-db
    creationPolicy: Owner
    template:
      data:
        GOV_DSN: "postgresql://org_reader:{{ .pw }}@postgres:5432/org?sslmode=require"
  data:
  - {secretKey: pw, remoteRef: {key: pg-org-reader-password}}
---
# Dapr komponenty jako Secret (connection string state storu nese heslo PG) – daprd je čte z /dapr/components (volume místo ConfigMapy)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dapr-components
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: azure-kv}
  target:
    name: dapr-components
    creationPolicy: Owner
    template:
      data:
        statestore.yaml: |
          apiVersion: dapr.io/v1alpha1
          kind: Component
          metadata:
            name: statestore
          spec:
            type: state.postgresql
            version: v1
            metadata:
            - name: connectionString
              value: "host=postgres user=platform password={{ .pg }} port=5432 dbname=dapr_state sslmode=require"
            - name: actorStateStore
              value: "true"
  data:
  - {secretKey: pg, remoteRef: {key: pg-platform-password}}

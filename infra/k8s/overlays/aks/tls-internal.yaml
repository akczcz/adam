# P3-6 E7: TLS OpenBao a Keycloaku z interní CA (ClusterIssuer platform-ca, infra/k8s/trust/pki.yaml). Listenery obou služeb jsou jen HTTPS
# (OpenBao 8200, Keycloak 8443; issuer tokenů https://keycloak:8443/realms/p0), klienti ověřují proti ConfigMapě platform-ca (trust-manager Bundle:
# jen root platformy → SSL_CERT_FILE v podech aplikace, paměti, governance – ty volají jen interní HTTPS; pody rolí ji mají od P2-4).
# SAN: jméno Service (krátké i FQDN) + localhost/127.0.0.1 pro `kubectl port-forward` harnessu a operátora (bez ingressu; jiný přístup zvenčí není).
# Rotace: cert-manager obnoví leaf 30 dní před koncem (duration 90 d); oba servery soubory znovu načtou samy bez restartu – Keycloak
# `https-certificates-reload-period` (zde 1 m, default 1 h), OpenBao `tls_auto_reload` (30 s); harness E7c rotaci vyvolá a změří.
# Klíč PKCS8 (Keycloak/Vert.x bere PKCS8 i SEC1, OpenBao/Go oba – PKCS8 je jednoznačný).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
spec:
  secretName: openbao-tls
  duration: 2160h
  renewBeforePercentage: 33
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8, rotationPolicy: Always}
  dnsNames: [openbao, openbao.platform-data, openbao.platform-data.svc, openbao.platform-data.svc.cluster.local, localhost]
  ipAddresses: ["127.0.0.1"]
  issuerRef: {name: platform-ca, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
spec:
  secretName: keycloak-tls
  duration: 2160h
  renewBeforePercentage: 33
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8, rotationPolicy: Always}
  dnsNames: [keycloak, keycloak.platform-data, keycloak.platform-data.svc, keycloak.platform-data.svc.cluster.local, localhost]
  ipAddresses: ["127.0.0.1"]
  issuerRef: {name: platform-ca, kind: ClusterIssuer, group: cert-manager.io}
---
# P3-6 E11: TLS zbytku datové vrstvy uvnitř clusteru – ClickHouse (https 8443, native 9440; plaintext porty odebrány, clickhouse-aks.yaml)
# a OTEL Collector (OTLP gRPC 4317 / HTTP 4318 s TLS, otel-collector-aks.yaml). Klienti: Collector → ClickHouse `secure=true` (SSL_CERT_FILE = platform-ca),
# Governance MCP → https (SSL_CERT_FILE), agentgateway → https Collector (rustls-native-certs čte SSL_CERT_FILE/SSL_CERT_DIR), paměť → OTLP https
# (OTEL_EXPORTER_OTLP_CERTIFICATE). Reload certifikátu: Collector `reload_interval` 1 m; ClickHouse jen `SYSTEM RELOAD CONFIG`/restart podu.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clickhouse-tls
spec:
  secretName: clickhouse-tls
  duration: 2160h
  renewBeforePercentage: 33
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8, rotationPolicy: Always}
  dnsNames: [clickhouse, clickhouse.platform-data, clickhouse.platform-data.svc, clickhouse.platform-data.svc.cluster.local, localhost]
  ipAddresses: ["127.0.0.1"]
  issuerRef: {name: platform-ca, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-collector-tls
spec:
  secretName: otel-collector-tls
  duration: 2160h
  renewBeforePercentage: 33
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8, rotationPolicy: Always}
  dnsNames: [otel-collector, otel-collector.platform-data, otel-collector.platform-data.svc, otel-collector.platform-data.svc.cluster.local, localhost]
  ipAddresses: ["127.0.0.1"]
  issuerRef: {name: platform-ca, kind: ClusterIssuer, group: cert-manager.io}

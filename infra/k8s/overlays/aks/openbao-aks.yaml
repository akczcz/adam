# P2-3 (patch base ConfigMapy): config OpenBao pro AKS = base + seal azurekeyvault (parametry z env: VAULT_AZUREKEYVAULT_*, AZURE_TENANT_ID z webhooku workload identity)
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  annotations: {kustomize.toolkit.fluxcd.io/substitute: disabled}
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file   = "/openbao/tls/tls.crt"   # P3-6 E7: cert z cert-manageru (Certificate openbao-tls, ClusterIssuer platform-ca); reload jen SIGHUP/restart
      tls_key_file    = "/openbao/tls/tls.key"
      tls_min_version = "tls12"
    }
    storage "raft" {
      path    = "/openbao/data"
      node_id = "openbao-0"
    }
    # OpenBao 2.7 už nemá cloud KMS sealy zabudované (changelog 2.7.0) → externí KMS plugin openbao-plugin-kms-azure (openbao-plugins,
    # release kms-azure-v0.1.0), binárku stahuje init kontejner kms-plugin do emptyDir; jméno seal stanzy = jméno pluginu
    plugin_directory = "/openbao/plugins"
    plugin "kms" "azurekeyvault" {
      command = "openbao-plugin-kms-azure"
      version = "v0.1.0"
    }
    seal "azurekeyvault" {}           # vault_name/key_name/tenant/auth z env (VAULT_AZUREKEYVAULT_*, AZURE_* z webhooku) – klíč openbao-unseal, identita podu (UAMI)
    audit "stdout" {
      type    = "file"
      path    = "file/"
      options = { file_path = "stdout" }
    }

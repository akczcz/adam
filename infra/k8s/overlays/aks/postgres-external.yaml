# Postgres mimo cluster: Azure Database for PostgreSQL Flexible Server (infra/terraform/postgres.tf). Služba `postgres` zůstává jménem,
# na které míří všechny komponenty; databáze a extension vector zakládá Terraform (infra/terraform/postgres.tf), ne kontejner.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ExternalName
  externalName: "${PG_HOST}"
  ports:
  - {name: pg, port: 5432}
# heslo admin účtu Flexible Serveru: Secret postgres-auth dává ESO z Key Vaultu (secrets-eso.yaml, P3-6 E1); na kind ho má base/postgres

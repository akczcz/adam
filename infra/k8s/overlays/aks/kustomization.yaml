# Overlay pro AKS dev cluster (infra/aks/create.sh): oficiální obrazy z ACR, Postgres = Azure Database for PostgreSQL Flexible Server
# (ExternalName), bez NodePortů (přístup přes kubectl port-forward / interní LB později). Placeholdery nahrazuje infra/aks/deploy.sh
# (ACR_PLACEHOLDER, PG_HOST_PLACEHOLDER, PG_PASSWORD_PLACEHOLDER) – kustomize neumí env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-data
resources:
- namespace.yaml
- ../../base/clickhouse
- ../../base/otel-collector
- ../../base/keycloak
- ../../base/openbao
- ../../base/spire
- ../../base/agentgateway
- ../../base/opa
- ../../base/dapr
- ../../base/zakazka
- postgres-external.yaml
images:
- {name: platform/keycloak, newName: ACR_PLACEHOLDER.azurecr.io/keycloak, newTag: "26.8.1"}
- {name: platform/openbao, newName: ACR_PLACEHOLDER.azurecr.io/openbao, newTag: "2.7.1"}
- {name: platform/agentgateway, newName: ACR_PLACEHOLDER.azurecr.io/agentgateway, newTag: "1.6.0"}
- {name: platform/opa, newName: ACR_PLACEHOLDER.azurecr.io/opa, newTag: "1.11.0"}
- {name: platform/zakazka-app, newName: ACR_PLACEHOLDER.azurecr.io/zakazka-app, newTag: p1}
- {name: otel/opentelemetry-collector-contrib, newName: ACR_PLACEHOLDER.azurecr.io/otel-collector-contrib, newTag: "0.163.2"}
- {name: clickhouse, newName: ACR_PLACEHOLDER.azurecr.io/clickhouse, newTag: "26.8"}
patches:
# platform/dapr a platform/spire jsou na kind jeden obraz pro více binárek – oficiální obrazy jsou per komponenta
- target: {kind: StatefulSet, name: placement}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: ACR_PLACEHOLDER.azurecr.io/placement:1.18.9}
- target: {kind: StatefulSet, name: scheduler}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: ACR_PLACEHOLDER.azurecr.io/scheduler:1.18.9}
- target: {kind: Deployment, name: zakazka}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/1/image, value: ACR_PLACEHOLDER.azurecr.io/daprd:1.18.9}
- target: {kind: StatefulSet, name: spire-server}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: ACR_PLACEHOLDER.azurecr.io/spire-server:1.14.2}
- target: {kind: DaemonSet, name: spire-agent}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: ACR_PLACEHOLDER.azurecr.io/spire-agent:1.14.2}
    - {op: replace, path: /spec/template/spec/containers/0/command/0, value: /opt/spire/bin/spire-agent}
- target: {kind: StatefulSet, name: spire-server}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/command/0, value: /opt/spire/bin/spire-server}
# Postgres jako Azure služba: heslo admin účtu Flexible Serveru (dev), SSL vyžadováno
- target: {kind: Secret, name: postgres-auth}
  patch: |
    - {op: replace, path: /stringData/POSTGRES_PASSWORD, value: PG_PASSWORD_PLACEHOLDER}
- target: {kind: Secret, name: agentgateway-secrets}
  patch: |
    - {op: replace, path: /stringData/AGW_DATABASE_URL, value: "postgresql://platform:PG_PASSWORD_PLACEHOLDER@postgres:5432/agentgateway?sslmode=require"}
- target: {kind: ConfigMap, name: dapr-components}
  patch: |
    - {op: replace, path: /data/statestore.yaml, value: "apiVersion: dapr.io/v1alpha1\nkind: Component\nmetadata:\n  name: statestore\nspec:\n  type: state.postgresql\n  version: v1\n  metadata:\n  - name: connectionString\n    value: \"host=postgres user=platform password=PG_PASSWORD_PLACEHOLDER port=5432 dbname=dapr_state sslmode=require\"\n  - name: actorStateStore\n    value: \"true\"\n"}
- target: {kind: Deployment, name: keycloak}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/env/1/value, value: platform}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: KC_DB_URL_PROPERTIES, value: "?sslmode=require"}}
- target: {kind: Deployment, name: memory}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "postgresql://memory_app:memory_app@postgres:5432/memory?sslmode=require"}

# Overlay pro AKS dev cluster (Terraform infra/terraform, nasazuje Flux): oficiální obrazy z ACR, Postgres = Azure Database for PostgreSQL
# Flexible Server (ExternalName), bez NodePortů (přístup přes kubectl port-forward / interní LB později). Proměnné ${ACR_LOGIN_SERVER},
# ${PG_HOST}, ${PG_PASSWORD} dosazuje Flux postBuild substitute (infra/terraform/flux.tf); kustomize je nechává beze změny.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-data
resources:
- namespace.yaml
- spire-oidc.yaml
- agentgateway-egress.yaml   # P2-4: NetworkPolicy egressu gateway (ne IMDS/link-local/privátní sítě)
- ../../base/clickhouse
- ../../base/otel-collector
- ../../base/keycloak
- ../../base/openbao
- ../../base/spire
- ../../base/agentgateway
- ../../base/opa
- ../../base/dapr
- ../../base/zakazka
- ../../base/mock-upstream
- postgres-external.yaml
images:
- {name: platform/keycloak, newName: "${ACR_LOGIN_SERVER}/keycloak", newTag: "26.8.1"}
- {name: platform/openbao, newName: "${ACR_LOGIN_SERVER}/openbao", newTag: "2.7.1"}
- {name: platform/agentgateway, newName: "${ACR_LOGIN_SERVER}/agentgateway", newTag: "1.6.0"}
- {name: platform/opa, newName: "${ACR_LOGIN_SERVER}/opa", newTag: "1.11.0"}
- {name: platform/zakazka-app, newName: "${ACR_LOGIN_SERVER}/zakazka-app", newTag: p1}
- {name: otel/opentelemetry-collector-contrib, newName: "${ACR_LOGIN_SERVER}/otel-collector-contrib", newTag: "0.163.2"}
- {name: clickhouse, newName: "${ACR_LOGIN_SERVER}/clickhouse", newTag: "26.8"}
components:
- ../../rolegen   # P2-1: ConfigMap rolegen-build + patch agentgateway-config z Gitu (generuje tools/rolegen/render_k8s.py)
patches:
- path: openbao-aks.yaml   # P2-3: config OpenBao se seal azurekeyvault (patch base ConfigMapy)
# P2-1: upstream modelu gateway přes env (config z rolegen má baseUrl $LLM_UPSTREAM_URL)
- target: {kind: Deployment, name: agentgateway}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: http://mock-upstream:9777/v1}
# Flux postBuild substitute nahrazuje i cizí ${var}/$var (nedefinované → prázdný řetězec): agentgateway config ($AGW_DATABASE_URL,
# $ANTHROPIC_API_KEY = env expanze gateway) a realm Keycloaku (${username}, ${email} = i18n) musí zůstat beze změny
- target: {kind: ConfigMap, name: agentgateway-config}
  patch: |
    - {op: add, path: /metadata/annotations, value: {kustomize.toolkit.fluxcd.io/substitute: disabled}}
- target: {kind: ConfigMap, name: keycloak-realm}
  patch: |
    - {op: add, path: /metadata/annotations, value: {kustomize.toolkit.fluxcd.io/substitute: disabled}}
# platform/dapr a platform/spire jsou na kind jeden obraz pro více binárek – oficiální obrazy jsou per komponenta
- target: {kind: StatefulSet, name: placement}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: "${ACR_LOGIN_SERVER}/placement:1.18.9"}
- target: {kind: StatefulSet, name: scheduler}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: "${ACR_LOGIN_SERVER}/scheduler:1.18.9"}
- target: {kind: Deployment, name: zakazka}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/1/image, value: "${ACR_LOGIN_SERVER}/daprd:1.18.9"}
    - {op: replace, path: /spec/template/spec/containers/1/command/0, value: /daprd}
- target: {kind: StatefulSet, name: spire-server}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: "${ACR_LOGIN_SERVER}/spire-server:1.14.2"}
- target: {kind: DaemonSet, name: spire-agent}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/image, value: "${ACR_LOGIN_SERVER}/spire-agent:1.14.2"}
    - {op: replace, path: /spec/template/spec/containers/0/command/0, value: /opt/spire/bin/spire-agent}
- target: {kind: StatefulSet, name: spire-server}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/command/0, value: /opt/spire/bin/spire-server}
# Postgres jako Azure služba: heslo admin účtu Flexible Serveru (dev), SSL vyžadováno
- target: {kind: Secret, name: agentgateway-secrets}
  patch: |
    - {op: replace, path: /stringData/AGW_DATABASE_URL, value: "postgresql://platform:${PG_PASSWORD}@postgres:5432/agentgateway?sslmode=require"}
- target: {kind: Secret, name: zakazka-finops}   # P2-6: tatáž DB jako gateway (budget_usage) + registr org
  patch: |
    - {op: replace, path: /stringData/P0_FINOPS_DSN, value: "postgresql://platform:${PG_PASSWORD}@postgres:5432/agentgateway?sslmode=require"}
    - {op: replace, path: /stringData/P0_REGISTRY_DSN, value: "postgresql://platform:${PG_PASSWORD}@postgres:5432/org?sslmode=require"}
- target: {kind: ConfigMap, name: dapr-components}
  patch: |
    - {op: replace, path: /data/statestore.yaml, value: "apiVersion: dapr.io/v1alpha1\nkind: Component\nmetadata:\n  name: statestore\nspec:\n  type: state.postgresql\n  version: v1\n  metadata:\n  - name: connectionString\n    value: \"host=postgres user=platform password=${PG_PASSWORD} port=5432 dbname=dapr_state sslmode=require\"\n  - name: actorStateStore\n    value: \"true\"\n"}
- target: {kind: Deployment, name: keycloak}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/env/1/value, value: platform}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: KC_DB_URL_PROPERTIES, value: "?sslmode=require"}}
- target: {kind: Deployment, name: memory}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "postgresql://memory_app:memory_app@postgres:5432/memory?sslmode=require"}
# Oficiální obrazy se liší od kind buildů (měřeno 2026-10-25, první Flux nasazení): daprio/* mají binárku v / (ne v PATH),
# quay.io/keycloak není předbuildovaný pro Postgres (start bez --optimized + KC_DB), ghcr.io/spiffe obrazy běží jako uid 1000
# (PVC data_dir potřebuje fsGroup, hostPath socket agenta root).
- target: {kind: StatefulSet, name: placement}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/command/0, value: /placement}
- target: {kind: StatefulSet, name: scheduler}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/command/0, value: /scheduler}
- target: {kind: Deployment, name: keycloak}
  patch: |
    - {op: replace, path: /spec/template/spec/containers/0/args, value: ["start", "--import-realm", "--http-enabled=true", "--hostname-strict=false", "--proxy-headers=xforwarded"]}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: KC_DB, value: postgres}}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: KC_HEALTH_ENABLED, value: "true"}}
- target: {kind: StatefulSet, name: spire-server}
  patch: |
    - {op: add, path: /spec/template/spec/securityContext, value: {fsGroup: 1000, runAsUser: 1000, runAsNonRoot: true}}
- target: {kind: DaemonSet, name: spire-agent}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/securityContext, value: {runAsUser: 0}}
# P1-6: role jako Kata pody v ns tenanta (P3-2: tenant-<id> z infra/k8s/roles/tenants-generated.yaml – vlastní Flux kustomization); služby přes FQDN, aby na ně dosáhl pod z jiného ns
- target: {kind: ConfigMap, name: zakazka-env}
  patch: |
    - {op: add, path: /data/P0_ROLE_RUNTIME, value: pod}
    - {op: add, path: /data/P0_ROLE_IMAGE, value: "${ACR_LOGIN_SERVER}/zakazka-app:p1"}
    - {op: add, path: /data/P0_ROLE_IMAGE_REGISTRY, value: "${ACR_LOGIN_SERVER}"}   # P2-2: šablona podu z rolegen má registry.platform.internal/roles/<role>:<verze> → ACR
    - {op: add, path: /data/P0_ROLE_NAMESPACE_TEMPLATE, value: "tenant-{tenant}"}   # P3-2: pody rolí v namespace tenanta zakázky (infra/k8s/roles/tenants-generated.yaml)
    - {op: add, path: /data/P0_ARTIFACT_API, value: http://zakazka.platform-data.svc:8010}
    - {op: replace, path: /data/P0_LLM_URL, value: http://agentgateway.platform-data.svc:4100}
    - {op: replace, path: /data/P0_MEMORY_URL, value: http://memory.platform-data.svc:9900}
# Tajemství aplikace vydává harness za běhu: Flux objekt založí s placeholdery (čerstvý cluster), ale už ho nikdy nepřepíše (ssa: IfNotPresent).
# Konfigurace gateway je od P2-1 z Gitu (infra/k8s/rolegen); klíče per zakázka zapisuje aplikace do ConfigMapy agentgateway-keys, kterou Flux
# po založení nepřepisuje a sidecar config-merge ji slévá do configu
- target: {kind: Secret, name: zakazka-secrets}
  patch: |
    - {op: add, path: /metadata/annotations, value: {kustomize.toolkit.fluxcd.io/ssa: IfNotPresent}}
- target: {kind: ConfigMap, name: agentgateway-keys}
  patch: |
    - {op: add, path: /metadata/annotations, value: {kustomize.toolkit.fluxcd.io/ssa: IfNotPresent}}
# Tag zakazka-app:p1 je pohyblivý (images.yml ho přepisuje) – bez Always by uzel použil starý obraz z cache (AKS 2026-10-25)
- target: {kind: Deployment, name: zakazka}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
- target: {kind: Deployment, name: memory}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
- target: {kind: Deployment, name: mock-github}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
- target: {kind: Deployment, name: bridge}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
- target: {kind: Deployment, name: mock-upstream}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
- target: {kind: Deployment, name: mock-mirror}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Always}
# P2-3: OpenBao auto-unseal (seal azurekeyvault přes workload identitu SA openbao), auth kubernetes pro aplikaci (žádný token v Secretu)
- target: {kind: ServiceAccount, name: openbao}
  patch: |
    - {op: add, path: /metadata/annotations, value: {azure.workload.identity/client-id: "${OPENBAO_CLIENT_ID}"}}
- target: {kind: StatefulSet, name: openbao}
  patch: |
    - {op: add, path: /spec/template/metadata/labels/azure.workload.identity~1use, value: "true"}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: VAULT_AZUREKEYVAULT_VAULT_NAME, value: "${KV_NAME}"}}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: VAULT_AZUREKEYVAULT_KEY_NAME, value: openbao-unseal}}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: VAULT_AZUREKEYVAULT_AUTH_METHOD, value: workload_identity}}
    - {op: add, path: /spec/template/spec/containers/0/volumeMounts/-, value: {name: plugins, mountPath: /openbao/plugins}}
    - {op: add, path: /spec/template/spec/volumes/-, value: {name: plugins, emptyDir: {}}}
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: kms-plugin          # stáhne a ověří KMS plugin Azure Key Vault (sha256 z checksums releasu); jméno binárky normalizuje na openbao-plugin-kms-azure
        image: "${ACR_LOGIN_SERVER}/zakazka-app:p1"
        command: ["bash", "-ec"]
        args:                     # bez shellových proměnných: Flux postBuild substitute by $V/$A/$bin nahradil prázdným řetězcem (StatefulSet substitute potřebuje)
        - |
          cd /tmp
          curl -fsSL -o plugin.tgz https://github.com/openbao/openbao-plugins/releases/download/kms-azure-v0.1.0/openbao-plugin-kms-azure_linux_amd64_v1.tar.gz
          curl -fsSL -o sums https://github.com/openbao/openbao-plugins/releases/download/kms-azure-v0.1.0/checksums-kms-azure.txt
          grep -F ' openbao-plugin-kms-azure_linux_amd64_v1.tar.gz' sums | sed 's/ .*/  plugin.tgz/' | sha256sum -c -
          mkdir -p x && tar -xzf plugin.tgz -C x
          find x -type f -size +1M -exec cp {} /openbao/plugins/openbao-plugin-kms-azure ';'
          chmod 755 /openbao/plugins/openbao-plugin-kms-azure && ls -la /openbao/plugins && sha256sum /openbao/plugins/openbao-plugin-kms-azure
        volumeMounts: [{name: plugins, mountPath: /openbao/plugins}]
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
# P2-3: SPIRE OIDC discovery provider jako sidecar serveru (JWKS pro JWT-SVID rolí), server paměti přijímá i JWT-SVID
- target: {kind: StatefulSet, name: spire-server}
  patch: |
    - op: add
      path: /spec/template/spec/containers/-
      value:
        name: oidc
        image: "${ACR_LOGIN_SERVER}/oidc-discovery-provider:1.14.2"
        args: ["-config", "/run/spire/oidc/oidc.conf"]
        ports: [{containerPort: 8082, name: oidc}]
        volumeMounts:
        - {name: server-sock, mountPath: /tmp/spire-server/private}
        - {name: oidc-config, mountPath: /run/spire/oidc, readOnly: true}
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
    - op: add
      path: /spec/template/spec/volumes/-
      value: {name: oidc-config, configMap: {name: spire-oidc-config}}
- target: {kind: Deployment, name: memory}
  patch: |
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: MEMORY_SPIRE_JWKS_URL, value: http://spire-oidc:8082/keys}}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: MEMORY_SPIRE_ISSUER, value: http://spire-oidc.platform-data.svc:8082}}
    - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: MEMORY_SPIRE_DEFAULT_TENANT, value: acme}}
- target: {kind: ConfigMap, name: zakazka-env}
  patch: |
    - {op: add, path: /data/P0_BAO_K8S_ROLE, value: zakazka}
    - {op: add, path: /data/P0_ROLE_IDENTITY, value: svid}
    - {op: add, path: /data/P0_ROLE_SPIRE_AGENT_IMAGE, value: "${ACR_LOGIN_SERVER}/spire-agent:1.14.2"}
# P2-4: egress podu role přes gateway CONNECT – CA gateway z ConfigMapy platform-ca (ns tenant-<id>, vydává harness), git a mirror přes
# terminované listenery; sonda role_runner (clone/push větve/push main/pip/npm/cizí SNI) měří P24b–d
- target: {kind: ConfigMap, name: zakazka-env}
  patch: |
    - {op: add, path: /data/P0_ROLE_CA_CONFIGMAP, value: platform-ca}
    - {op: add, path: /data/P0_ROLE_GIT_URL, value: https://git.platform.internal/acme/platform.git}
    - {op: add, path: /data/P0_ROLE_MIRROR_URL, value: https://mirror.platform.internal}
    - {op: add, path: /data/P0_ROLE_EGRESS_PROXY, value: http://agentgateway.platform-data.svc:3128}
# P2-6: hodnoty klíčů gateway role × zakázka drží OpenBao (KV v2 secret/zakazky/<id>), ne Kubernetes Secret; aplikace přes auth kubernetes (P2-3)
- target: {kind: ConfigMap, name: zakazka-env}
  patch: |
    - {op: add, path: /data/P0_BAO_KV, value: secret}

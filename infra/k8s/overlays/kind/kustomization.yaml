# Overlay pro lokální kind (infra/kind/kind-platform.yaml): služby jako NodePort, aby harnessy na hostu dosáhly na 127.0.0.1:<port>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-data
resources:
- namespace.yaml
- ../../base/postgres
- ../../base/clickhouse
- ../../base/otel-collector
- ../../base/keycloak
- ../../base/openbao
- ../../base/spire
- ../../base/agentgateway
patches:
- target: {kind: Service, name: postgres}
  patch: |
    - op: add
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30432
- target: {kind: Service, name: clickhouse}
  patch: |
    - op: add
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30123
    - op: add
      path: /spec/ports/1/nodePort
      value: 30900
- target: {kind: Service, name: otel-collector}
  patch: |
    - op: add
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30317
    - op: add
      path: /spec/ports/1/nodePort
      value: 30318
- target: {kind: Service, name: keycloak}
  patch: |
    - op: add
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30080
- target: {kind: Service, name: openbao}
  patch: |
    - op: add
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30200
- target: {kind: Service, name: agentgateway}
  patch: |
    - op: add
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30410

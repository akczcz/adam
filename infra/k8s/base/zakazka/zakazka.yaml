---
# P3-3: Governance MCP – jen čtení schématu org (DB role org_reader, RLS per tenant z tokenu člověka); GUI ho volá přes AG-UI server.
apiVersion: v1
kind: Service
metadata:
  name: governance
  labels: {app: governance}
spec:
  selector: {app: governance}
  ports:
  - {name: http, port: 9910, targetPort: 9910}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance
spec:
  replicas: 1
  selector:
    matchLabels: {app: governance}
  template:
    metadata:
      labels: {app: governance}
    spec:
      containers:
      - name: governance
        image: platform/zakazka-app:p1
        command: ["python", "/app/governance_mcp/governance_mcp.py"]
        env:
        - {name: GOV_PORT, value: "9910"}
        - {name: GOV_DSN, value: "postgresql://org_reader:org_reader@postgres:5432/org"}   # role org_reader (jen SELECT, RLS); heslo dev – P3-6 ESO/OpenBao
        - {name: GOV_KC_JWKS_URL, value: http://keycloak:8080/realms/p0/protocol/openid-connect/certs}
        - {name: GOV_KC_ISSUER, value: http://keycloak:8080/realms/p0}
        ports:
        - {containerPort: 9910, name: http}
        readinessProbe:
          httpGet: {path: /health, port: 9910}
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}

# OTEL Collector contrib 0.163.2 – jediný bod normalizace (gen_ai_normalizer), maskování (redaction) a uložení (clickhouse).
# Config odvozen z tools/harness_observability_o1/configs/otelcol.yaml; místo file exportérů jdou i metriky do ClickHouse.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  otelcol.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      gen_ai_normalizer:
        sources:
          - name: openinference
          - name: openllmetry
      redaction:
        allow_all_keys: true
        blocked_values:
          - "sk-[A-Za-z0-9]+"
        summary: debug
      batch:
        timeout: 1s
    exporters:
      clickhouse:
        endpoint: tcp://clickhouse:9000?dial_timeout=10s
        database: otel
        username: default
        create_schema: true
        ttl: 0
        timeout: 10s
        sending_queue:
          queue_size: 100
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 60s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          receivers: [otlp]
          processors: [gen_ai_normalizer, redaction, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
        logs:
          receivers: [otlp]
          processors: [redaction, batch]
          exporters: [clickhouse]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: {app: otel-collector}
spec:
  selector: {app: otel-collector}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      containers:
      - name: otelcol
        image: otel/opentelemetry-collector-contrib:0.163.2
        args: ["--config", "/conf/otelcol.yaml"]
        ports:
        - {containerPort: 4317, name: otlp-grpc}
        - {containerPort: 4318, name: otlp-http}
        volumeMounts:
        - {name: config, mountPath: /conf}
        readinessProbe:
          httpGet: {path: /, port: 13133}
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
      volumes:
      - name: config
        configMap: {name: otel-collector-config}

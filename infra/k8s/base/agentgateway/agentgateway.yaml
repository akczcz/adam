# agentgateway 1.6.0 – model gateway a FinOps: LLM listener (Anthropic Messages API passthrough), rozpočty per klíč role × zakázka
# (policies.apiKey.keys[].budgets), usage v Postgresu (config.database → tabulka budget_usage sdílená replikami).
# Config zde je výchozí; overlaye ho nahrazují patchem infra/k8s/rolegen/agentgateway-config.yaml (P2-1: generuje render_k8s.py z rolí,
# upstream přes env LLM_UPSTREAM_URL, klíče role × zakázka doplňuje aplikace při založení zakázky – gateway_keys.py).
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: sk-ant-harness-mock      # kind: mock upstream; AKS: z OpenBao
  AGW_DATABASE_URL: postgresql://postgres:platform-dev@postgres:5432/agentgateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
data:
  config.yaml: |
    config:
      enableIpv6: false
      readinessAddr: 0.0.0.0:19001
      statsAddr: 0.0.0.0:19002
      database:
        url: $AGW_DATABASE_URL
      logging:
        format: json
        fields:
          add:
            zakazka: '"x-zakazka" in request.headers ? request.headers["x-zakazka"] : ""'
            role: 'apiKey != null ? string(apiKey.role) : ""'
    llm:
      port: 4100
      models:
      - name: '*'
        provider: anthropic
        params:
          baseUrl: https://api.anthropic.com/v1
          apiKey: $ANTHROPIC_API_KEY
---
# Klíče role × zakázka (P2-1): vlastní aplikace zakázky (gateway_keys.py), Flux jen založí prázdnou (overlay aks: ssa IfNotPresent).
# Sidecar config-merge je slévá do configu z Gitu – dvě ConfigMapy, dva vlastníci, žádná hádka s Fluxem.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-keys
data:
  keys.yaml: "[]"
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  labels: {app: agentgateway}
spec:
  selector: {app: agentgateway}
  ports:
  - {name: llm, port: 4100, targetPort: 4100}
  - {name: stats, port: 19002, targetPort: 19002}
---
# Headless služba: DNS vrací IP všech replik – aplikace po vydání klíčů (gateway_keys.py) sonduje každou repliku zvlášť, protože ConfigMap
# volume se do podů propaguje nezávisle (P21b 2026-10-25: sonda přes ClusterIP trefila aktualizovanou repliku, role pak 401 z té druhé)
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-headless
  labels: {app: agentgateway}
spec:
  clusterIP: None
  selector: {app: agentgateway}
  ports:
  - {name: llm, port: 4100, targetPort: 4100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: agentgateway}
  template:
    metadata:
      labels: {app: agentgateway}
    spec:
      initContainers:
      - name: config-merge          # nativní sidecar (restartPolicy Always): před startem gateway slije config + klíče, pak hlídá změny obou ConfigMap
        image: platform/zakazka-app:p1
        restartPolicy: Always
        command: ["python", "/app/harness_p0_o2/gateway_merge.py"]
        volumeMounts:
        - {name: config-src, mountPath: /config-src, readOnly: true}
        - {name: keys-src, mountPath: /keys-src, readOnly: true}
        - {name: config, mountPath: /etc/agentgateway}
        startupProbe:
          exec: {command: ["test", "-s", "/etc/agentgateway/config.yaml"]}
          periodSeconds: 1
          failureThreshold: 60
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      containers:
      - name: agentgateway
        image: platform/agentgateway:1.6.0   # kind: busybox + statická binárka (infra/images); AKS: ghcr.io/agentgateway/agentgateway:1.6.0
        args: ["-f", "/etc/agentgateway/config.yaml"]
        envFrom:
        - secretRef: {name: agentgateway-secrets}
        env:
        - {name: LLM_UPSTREAM_URL, value: https://api.anthropic.com/v1}   # config.yaml z rolegen (infra/k8s/rolegen) má baseUrl $LLM_UPSTREAM_URL; overlay: mock
        ports:
        - {containerPort: 4100, name: llm}
        - {containerPort: 19001, name: ready}
        - {containerPort: 19002, name: stats}
        volumeMounts:
        - {name: config, mountPath: /etc/agentgateway, readOnly: true}
        readinessProbe:
          httpGet: {path: /healthz/ready, port: 19001}
          periodSeconds: 3
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
      volumes:
      - name: config
        emptyDir: {}                                   # slitý config (sidecar config-merge)
      - name: config-src
        configMap: {name: agentgateway-config}         # z Gitu (infra/k8s/rolegen přes component)
      - name: keys-src
        configMap: {name: agentgateway-keys, optional: true}   # klíče per zakázka od aplikace

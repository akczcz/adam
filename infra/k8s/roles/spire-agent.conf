# SPIRE agent jako sidecar podu role (P2-3): rolegen z toho dělá ConfigMap spire-agent-pod v každém namespace tenanta (P3-2, tenants-generated.yaml).
agent {
  data_dir = "/run/spire/data"
  log_level = "INFO"
  server_address = "spire-server.platform-data.svc"
  server_port = "8081"
  socket_path = "/run/spire/sockets/agent.sock"
  trust_domain = "platform"
  insecure_bootstrap = true        # dev: bundle serveru není v ns rolí (notifier k8sbundle plní jen platform-data); P3: bundle ConfigMap i sem
}
plugins {
  NodeAttestor "k8s_psat" {
    plugin_data {
      cluster = "platform"
      token_path = "/var/run/secrets/tokens/spire-agent"
    }
  }
  KeyManager "memory" {
    plugin_data {}
  }
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}

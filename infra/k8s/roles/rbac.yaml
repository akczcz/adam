# Aplikace zakázky (SA zakazka, ns platform-data) smí v ns rolí zakládat a mazat pody a Secrety běhu a číst logy – nic jiného.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role-pods
  namespace: platform-roles
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [create, get, list, watch, delete]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [secrets]
  verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zakazka-role-pods
  namespace: platform-roles
subjects:
- kind: ServiceAccount
  name: zakazka
  namespace: platform-data
roleRef:
  kind: Role
  name: role-pods
  apiGroup: rbac.authorization.k8s.io

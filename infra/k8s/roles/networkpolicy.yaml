# Síť podů rolí: default-deny ingress i egress; egress jen DNS (kube-system), agentgateway (LLM 4100, CONNECT 3128), server paměti
# a HTTP API aplikace zakázky (artefakty, výsledek). Internet ani zbytek clusteru ne – měří role_runner.py (egress probe) a S1h-4.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform-roles
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: role-egress
  namespace: platform-roles
spec:
  podSelector:
    matchLabels: {app: role}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-data}}
      podSelector: {matchLabels: {app: agentgateway}}
    ports: [{protocol: TCP, port: 4100}, {protocol: TCP, port: 3128}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-data}}
      podSelector: {matchLabels: {app: memory}}
    ports: [{protocol: TCP, port: 9900}]
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: platform-data}}
      podSelector: {matchLabels: {app: zakazka}}
    ports: [{protocol: TCP, port: 8010}]

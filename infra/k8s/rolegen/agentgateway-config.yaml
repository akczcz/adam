# GENEROVÁNO: python tools/rolegen/render_k8s.py z knowledge/organization/roles/*.yaml – neupravovat ručně (CI kontroluje `--check`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
data:
  config.yaml: "config:\n  enableIpv6: false\n  readinessAddr: 0.0.0.0:19001\n  statsAddr:\
    \ 0.0.0.0:19002\n  database:\n    url: $AGW_DATABASE_URL\n  logging:\n    format:\
    \ json\n    fields:\n      add:\n        zakazka: '\"x-zakazka\" in request.headers\
    \ ? request.headers[\"x-zakazka\"] :\n          \"\"'\n        role: 'apiKey !=\
    \ null ? string(apiKey.role) : \"\"'\n        sni: destination.hostname\nllm:\n\
    \  port: 4100\n  models:\n  - name: '*'\n    provider: anthropic\n    params:\n\
    \      baseUrl: $LLM_UPSTREAM_URL\n      apiKey: $ANTHROPIC_API_KEY\n  policies:\n\
    \    apiKey:\n      mode: optional\n      location:\n        header:\n       \
    \   name: x-api-key\n      keys: []\nbinds:\n- port: 3128\n  tunnelProtocol: connect\n\
    \  listeners: []\ngateways:\n  secure:\n    port: 443\n    listeners:\n    - name:\
    \ git\n      hostname: git.platform.internal\n      protocol: HTTPS\n      tls:\n\
    \        cert: /etc/agentgateway/tls/tls.crt\n        key: /etc/agentgateway/tls/tls.key\n\
    \    - name: mirror\n      hostname: mirror.platform.internal\n      protocol:\
    \ HTTPS\n      tls:\n        cert: /etc/agentgateway/tls/tls.crt\n        key:\
    \ /etc/agentgateway/tls/tls.key\n    - name: public-egress\n      hostname: '*'\n\
    \      protocol: TLS\nroutes:\n- name: git-acme\n  gateways: secure/git\n  matches:\n\
    \  - path:\n      pathPrefix: /acme/\n  policies:\n    authorization:\n      rules:\n\
    \      - allow: request.method == \"GET\" || request.method == \"POST\"\n    backendAuth:\n\
    \      key:\n        value:\n          file: /etc/agentgateway/git/token\n   \
    \     location:\n          header:\n            name: Authorization\n        \
    \    prefix: 'Bearer '\n  backends:\n  - host: $GIT_BACKEND_HOST\n- name: mirror-acme\n\
    \  gateways: secure/mirror\n  matches:\n  - path:\n      pathPrefix: /\n  policies:\n\
    \    authorization:\n      rules:\n      - allow: request.method == \"GET\"\n\
    \  backends:\n  - host: $MIRROR_BACKEND_HOST\n"

# Interní CA platformy (P3-6 E1): self-signed root (10 let, rotace ručně – cert-manager CA nerotuje) → ClusterIssuer platform-ca vydává
# serverové certifikáty služeb (agentgateway-tls v overlays/aks/secrets-eso.yaml). Root žije v namespace cert-manager (ClusterIssuer čte Secret
# z cluster resource namespace). trust-manager rozdává ca.crt jako ConfigMap platform-ca – stejný název a klíč, jaký čekají pody rolí
# (P0_ROLE_CA_CONFIGMAP, role_pod.py) – do namespaců s labelem platform.ca-bundle=true.
# SPIRE zůstává samostatná trust doména pro identitu rolí (SVID); cert-manager = TLS infrastruktury.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: platform-root-ca
  secretName: platform-root-ca
  duration: 87600h
  privateKey: {algorithm: ECDSA, size: 256, encoding: PKCS8}
  issuerRef: {name: selfsigned, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca: {secretName: platform-root-ca}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: platform-ca
spec:
  sources:
  - secret: {name: platform-root-ca, key: ca.crt}
  target:
    configMap: {key: ca.crt}
    namespaceSelector:
      matchLabels: {platform.ca-bundle: "true"}

# ESO ClusterSecretStore azure-kv: Key Vault ${KV_NAME} přes Workload Identity (referenced SA – controller sám žádná práva na Azure nemá;
# token SA eso-keyvault vymění za token UAMI id-eso s rolí Key Vault Secrets User – infra/terraform/secrets.tf). remoteRef.key bez prefixu = secret/<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-keyvault
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: "${ESO_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"   # ESO bere tenant z anotace SA (bez ní klient nevznikne – 1. běh E1)
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity   # tenant jen z anotace SA – tenantId ve spec navíc = „multiple tenantID found“ (ESO 2.14, 2. běh E1)
      vaultUrl: "https://${KV_NAME}.vault.azure.net"
      serviceAccountRef: {name: eso-keyvault, namespace: external-secrets}
